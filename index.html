<style>
:root{
  --paper:#F2F3EE;--surface:#FFFFFF;--sunk:#E7E9E2;--ink:#1B2130;--ink2:#545E6E;--ink3:#858C98;
  --line:#DADDD4;--line2:#BCC1B6;
  --accent:#2D49C2;--accent-ink:#2D49C2;--accent-soft:rgba(45,73,194,.09);--accent-line:rgba(45,73,194,.42);--on-accent:#FFFFFF;
  --ok:#1C7F4F;--ok-soft:rgba(28,127,79,.12);--ok-line:rgba(28,127,79,.5);
  --bad:#C2372E;--bad-soft:rgba(194,55,46,.1);--bad-line:rgba(194,55,46,.5);
  --hint:#9A6400;--hint-soft:rgba(220,160,30,.18);--hint-line:rgba(190,130,10,.6);
  --staff:rgba(27,33,48,.07);--shadow:0 1px 2px rgba(27,33,48,.08);--scrim:rgba(14,17,26,.42);
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Literata","PT Serif",Georgia,"Times New Roman",serif;
  --u:38px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#13161D;--surface:#1B1F28;--sunk:#242934;--ink:#E7E9EE;--ink2:#A6ADBA;--ink3:#737B8B;
    --line:#2C323E;--line2:#3D4452;
    --accent:#8FA3FF;--accent-ink:#A9B8FF;--accent-soft:rgba(143,163,255,.12);--accent-line:rgba(143,163,255,.5);--on-accent:#0F1430;
    --ok:#4FC88A;--ok-soft:rgba(79,200,138,.14);--ok-line:rgba(79,200,138,.55);
    --bad:#FF7A6E;--bad-soft:rgba(255,122,110,.13);--bad-line:rgba(255,122,110,.55);
    --hint:#F2B544;--hint-soft:rgba(242,181,68,.16);--hint-line:rgba(242,181,68,.6);
    --staff:rgba(231,233,238,.06);--shadow:0 1px 2px rgba(0,0,0,.4);--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13161D;--surface:#1B1F28;--sunk:#242934;--ink:#E7E9EE;--ink2:#A6ADBA;--ink3:#737B8B;
  --line:#2C323E;--line2:#3D4452;
  --accent:#8FA3FF;--accent-ink:#A9B8FF;--accent-soft:rgba(143,163,255,.12);--accent-line:rgba(143,163,255,.5);--on-accent:#0F1430;
  --ok:#4FC88A;--ok-soft:rgba(79,200,138,.14);--ok-line:rgba(79,200,138,.55);
  --bad:#FF7A6E;--bad-soft:rgba(255,122,110,.13);--bad-line:rgba(255,122,110,.55);
  --hint:#F2B544;--hint-soft:rgba(242,181,68,.16);--hint-line:rgba(242,181,68,.6);
  --staff:rgba(231,233,238,.06);--shadow:0 1px 2px rgba(0,0,0,.4);--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:820px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 18px calc(36px + env(safe-area-inset-bottom,0px))}

/* ---------- top bar & tabs ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:58px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand svg{width:24px;height:24px;color:var(--accent)}
.tabs{display:flex;gap:4px}
.tabs button{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:11px;color:var(--ink2);font-weight:500;font-size:14px}
.tabs button[aria-current=page]{color:var(--accent-ink);background:var(--accent-soft)}
body[data-view=practice] .top,body[data-view=summary] .top{display:none}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:13px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.small{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.kbd{font:500 10.5px/1 var(--sans);padding:3px 5px;border:1px solid currentColor;border-radius:5px;opacity:.45;white-space:nowrap}
@media (hover:none),(pointer:coarse){.kbd,.kb-only{display:none!important}}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:hover{background:var(--sunk)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--sunk);padding:3px;border-radius:10px;max-width:100%}
.seg button{padding:6px 11px;border-radius:8px;font-size:14px;color:var(--ink2);font-weight:500}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(18px)}
select.sel{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px}
input[type=range]{width:min(220px,100%);accent-color:var(--accent)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list+.list{margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 14px;padding:11px 14px;min-height:54px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>.lab{font-size:15px;font-weight:500}
.row.stack{flex-direction:column;align-items:stretch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;min-width:48px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink3);overflow:hidden}
.chip[aria-pressed=true]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.chip.word{font-family:var(--sans);font-size:14px}
.mb{position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:var(--line2)}
.mb[data-l=hi]{background:var(--ok)}.mb[data-l=mid]{background:var(--accent)}.mb[data-l=lo]{background:var(--bad)}
.chips-lab{font-size:13px;color:var(--ink3);margin-bottom:6px}
.chips+.chips-lab{margin-top:12px}
.links{display:flex;gap:18px;margin-top:10px}
.link{color:var(--accent-ink);font-size:14px;font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--paper);width:100%;max-width:540px;max-height:86vh;overflow:auto;border-radius:20px;padding:0 18px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .18s ease-out}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;background:var(--paper)}
.sheet-head h2{font-family:var(--serif);font-size:21px;font-weight:600}
.sheet .text{color:var(--ink2);font-size:16px;line-height:1.55}
.sheet .text+.text{margin-top:10px}
.sheet .text b{color:var(--ink);font-weight:600}
.sheet-foot{position:sticky;bottom:0;z-index:2;background:var(--paper);padding:14px 0 18px}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}

/* ---------- home ---------- */
.today{display:flex;align-items:center;gap:18px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--sunk)}.ring .fg{stroke:var(--accent);stroke-linecap:round}
.ring.done .fg{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:19px;font-weight:600}
.today-stats{display:flex;gap:10px 26px;flex-wrap:wrap;flex:1}
.stat span{display:block;font-size:12px;color:var(--ink3)}
.stat b{font-size:17px;font-weight:600}
.weak{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--hint-soft);font-size:15px}
.weak b{font-weight:600}
.sec{margin-top:24px}
.sec h2{font-size:14px;font-weight:600;color:var(--ink3);margin:0 0 10px 2px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:124px;padding:14px 14px 16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .08s,border-color .12s}
.tile:hover{border-color:var(--accent-line)}
.tile:active{transform:scale(.98)}
.tile .ic{width:30px;height:30px;color:var(--accent)}
.tile h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.15;margin-top:auto}
.tile .meta{display:flex;justify-content:space-between;gap:8px;width:100%;font-size:12.5px;color:var(--ink3);margin-top:-6px}
.tile .meta b{color:var(--ink);font-weight:600}
.tile .mb{height:4px}
.badge{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--accent);color:var(--on-accent)}

/* ---------- practice ---------- */
.practice{max-width:700px;margin:0 auto}
.p-top{max-width:560px;margin:0 auto}
.p-top{display:flex;align-items:center;gap:4px;height:52px}
.p-mid{flex:1;min-width:0;text-align:center;line-height:1.25}
.p-title{font-weight:600;font-size:15px}
.p-sub{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.p-bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.prompt{text-align:center;min-height:86px;padding:18px 0 12px;display:flex;flex-direction:column;justify-content:center}
.fb-main{font-family:var(--serif);font-size:29px;line-height:1.15;font-weight:600;letter-spacing:-.012em}
.fb-sub{color:var(--ink2);font-size:14px;margin-top:5px;min-height:20px}
.prompt[data-kind=ok] .fb-main{color:var(--ok)}
.prompt[data-kind=bad] .fb-main{color:var(--bad)}
.prompt[data-kind=wait] .fb-main{color:var(--ink3)}
.bar-actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:18px;min-height:48px}
.act{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 13px;white-space:nowrap;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink)}
.act svg.i{width:19px;height:19px}
.act:disabled{opacity:.4}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;padding:0 22px}
.act.primary .kbd{color:var(--on-accent)}

/* ladder: one row per semitone, rungs sit at their pitch height */
.ladder{position:relative;max-width:440px;margin:0 auto;height:calc(var(--span) * var(--u) + var(--u) - 4px)}
.staff{position:absolute;left:0;right:0;height:1px;background:var(--staff);pointer-events:none}
.rung{position:absolute;left:0;right:0;height:calc(var(--u) - 4px);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background-color:var(--surface);border-radius:11px;overflow:hidden;transition:background-color .12s,border-color .12s,box-shadow .12s}
.rung>*{position:relative;z-index:1}
.rung .num{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}
.rung .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.rung.chroma{left:18%;right:18%;background-color:var(--sunk)}
.rung.chroma .num{font-size:17px}
.rung.off{background-color:var(--paper);border-color:transparent;color:var(--line2)}
button.rung:not(:disabled):hover{border-color:var(--accent-line)}
button.rung:not(:disabled):active,.rung.press{background-image:linear-gradient(var(--accent-soft),var(--accent-soft))}
.rung.good{background-image:linear-gradient(var(--ok-soft),var(--ok-soft));border-color:var(--ok-line);color:var(--ok)}
.rung.bad{background-image:linear-gradient(var(--bad-soft),var(--bad-soft));border-color:var(--bad-line);color:var(--bad)}
.rung.reveal{background-image:linear-gradient(var(--hint-soft),var(--hint-soft));border-color:var(--hint-line);color:var(--hint)}
.rung.lit{box-shadow:inset 0 0 0 2px var(--accent)}
.rung.target{border:2px solid var(--accent)}
.rung .fill{position:absolute;inset:0;z-index:0;background:var(--ok-soft);transform-origin:left;transform:scaleX(0);transition:transform .08s linear}
.marker{position:absolute;left:-10px;right:-10px;height:2px;background:var(--ink);z-index:3;pointer-events:none;transition:top .07s linear}
.marker::before{content:"";position:absolute;left:0;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.marker[data-ok="1"],.marker[data-ok="1"]::before{background:var(--ok)}

.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 14px}
.pill{min-width:44px;height:44px;padding:0 10px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-family:var(--serif);font-size:19px;font-weight:600;position:relative}
.pill.empty{border-style:dashed;color:var(--ink3)}
.pill.given{background:var(--sunk);color:var(--ink2)}
.pill.cur{border:2px solid var(--accent)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.pill small{position:absolute;top:calc(100% + 3px);left:0;right:0;font:600 13px/1 var(--sans);color:var(--hint);text-align:center}
.seq.done{margin-bottom:30px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gbtn{height:64px;display:grid;place-items:center;padding:0 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-family:var(--serif);font-size:19px;font-weight:600;position:relative;text-align:center;line-height:1.1}
.gbtn .kbd{position:absolute;top:8px;right:8px}
.gbtn:hover{border-color:var(--accent-line)}
.gbtn.good{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.gbtn.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.gbtn.reveal{background:var(--hint-soft);border-color:var(--hint-line);color:var(--hint)}
.g-sep{grid-column:1/-1;height:4px}

/* piano keeps real-instrument colours in both themes */
.piano{position:relative;display:flex;height:220px;gap:3px;-webkit-user-select:none;user-select:none;touch-action:manipulation;padding:8px;background:#1E222B;border-radius:16px}
.wk{flex:1;position:relative;border-radius:0 0 9px 9px;background:#FAFAF7;color:#3A4150;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding-bottom:12px;font-size:14px;font-weight:600;transition:background-color .1s}
.bk{position:absolute;top:8px;width:9%;height:58%;background:#2B303B;color:#D9DCE3;border:1px solid #11141A;border-radius:0 0 7px 7px;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;padding-bottom:9px;font-size:11px;font-weight:600;transition:background-color .1s}
.wk .kbd{color:#3A4150}.bk .kbd{color:#D9DCE3}
.wk.press{background:#E3E6EE}.bk.press{background:#454B58}
.wk.good{background:#BDEBD2}.bk.good{background:#1C7F4F}
.wk.bad{background:#F6C4BF}.bk.bad{background:#C2372E}
.wk.reveal{background:#F7DE9C}.bk.reveal{background:#B07A10}

/* ---------- summary ---------- */
.summary{max-width:500px;margin:0 auto;text-align:center;padding-top:34px}
.sum-score{font-family:var(--serif);font-size:88px;font-weight:600;line-height:1;letter-spacing:-.03em}
.sum-title{font-family:var(--serif);font-size:24px;font-weight:600;margin-top:8px}
.sum-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:24px 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sum-stats div{padding:12px 6px;border-left:1px solid var(--line)}
.sum-stats div:first-child{border-left:0}
.sum-stats b{display:block;font-size:20px;font-weight:600}
.sum-stats span{font-size:12px;color:var(--ink3)}

    return { key, ctx: key.changed || c.cadence === 'each', targets: notes.map(v => mod(v, 12)), midi: notes.map(v => key.t + v), pre: c.giveFirst ? 1 : 0 };
  },
  playQ(q, c, how) {
    const T = tempo(), ev = [];
    let at = 0;
    if (wantsContext(q, how)) { ev.push(...cadenceEvents(q.key.t, c.scale)); at = cadenceLen() + T.gap + 0.15; }
    q.midi.forEach((m, i) => ev.push({ m, at: at + i * T.note, dur: i === q.midi.length - 1 ? T.note * 1.6 : T.note * 0.96, vel: 0.8 }));
    return AudioEngine.play(ev, { resolveAt: at + 0.1 });
  },
  tapSound(it, q, pos) { AudioEngine.tap(q.midi[pos] + nd(it - q.targets[pos])); },
  freeSound(pc, q) { return q && q.key ? q.key.t + mod(pc - q.key.pc, 12) : 60 + pc; },
  compare(q) {
    const T = tempo(), ev = [];
    q.given.forEach((g, i) => ev.push({ m: q.midi[i] + nd(g - q.targets[i]), at: i * T.note, dur: T.note * 0.96, vel: 0.75 }));
    const off = q.targets.length * T.note + 0.8;
    q.midi.forEach((m, i) => ev.push({ m, at: off + i * T.note, dur: T.note * 0.96, vel: 0.8 }));
    return AudioEngine.play(ev);
  },
  prompt: () => 'Запиши мелодию',
  feedback(q, c, ok) {
    const errs = q.results.filter(r => r === false).length;
    return [ok ? 'Верно' : `${errs} ${plural(errs, 'ошибка', 'ошибки', 'ошибок')}`, ''];
  },
  autoStep(s, c) {
    const w = s.qwin.slice(-6);
    if (w.length < 6 || c.len >= 8) return;
    if (w.filter(Boolean).length >= 5) {
      c.len++; s.qwin = []; s.unlocked.push(`${c.len} ${plural(c.len, 'нота', 'ноты', 'нот')} в мелодии`);
      toast(`Теперь ${c.len} ${plural(c.len, 'нота', 'ноты', 'нот')} в мелодии`);
    }
  },
});

const GROUPS = [['key', 'В тональности'], ['abs', 'Без тональности'], ['voice', 'Голос']];
const UNIT_FORMS = { 'ступень': ['ступень', 'ступени', 'ступеней'], 'интервал': ['интервал', 'интервала', 'интервалов'], 'аккорд': ['аккорд', 'аккорда', 'аккордов'], 'нота': ['нота', 'ноты', 'нот'] };
const unitCount = (n, unit) => { const f = UNIT_FORMS[unit] || [unit, unit, unit]; return `${n} ${plural(n, f[0], f[1], f[2])}`; };

/* =========================================================
   Config, selection, stats ids
   ========================================================= */
// Always the same live object per mode, so a running session and the settings sheet never diverge.
function cfgOf(m) {
  let c = DB.cfg[m.id];
  if (!c || typeof c !== 'object') c = DB.cfg[m.id] = {};
  const d = JSON.parse(JSON.stringify(m.defaults));
  for (const k in d) if (!(k in c)) c[k] = d[k];
  if (!c.sels || typeof c.sels !== 'object') c.sels = {};
  return c;
}
const variantOf = (m, c) => (m.variant ? m.variant(c) : '_');
const statsId = (m, c) => (m.variant ? m.id + ':' + m.variant(c) : m.id);
const startCountOf = (m, c) => (typeof m.startCount === 'function' ? m.startCount(c) : m.startCount || 3);
const isSelectable = (m, c) => (typeof m.selectable === 'function' ? m.selectable(c) : m.selectable !== false);
function selOf(m, c) {
  if (!c.sels) c.sels = {};
  const k = variantOf(m, c), all = m.allItems(c);
  let s = c.sels[k];
  if (!Array.isArray(s) || s.filter(x => all.includes(x)).length < 2) s = m.levels(c).slice(0, startCountOf(m, c));
  s = s.filter(x => all.includes(x));
  c.sels[k] = s;
  return s;
}
const ansType = () => (typeof P.mode.answer === 'function' ? P.mode.answer(P.c) : P.mode.answer);
const unitOf = (m, c) => (m.unitFor ? m.unitFor(c) : m.unit || 'вариант');
const parseItem = (m, k) => (m.kind === 'str' ? k : Number(k));

/* =========================================================
   Adaptive picking, recording, level-ups
   ========================================================= */
function pickItem(s, sel) {
  if (sel.length === 1) { s.last = sel[0]; return sel[0]; }
  const di = s.requeue.findIndex(r => r.due <= s.qi && sel.includes(r.item) && r.item !== s.last);
  if (di >= 0) { const it = s.requeue[di].item; s.requeue.splice(di, 1); s.last = it; return it; }
  const st = statsOf(P.sid);
  const w = sel.map(it => {
    if (it === s.last) return 0.15;
    if (!DB.settings.adaptive) return 1;
    const x = st.s[String(it)], acc = itemAcc(x);
    let v = acc == null ? 1.6 : 0.55 + 2.2 * (1 - acc);
    if (!x || x.a < 6) v += 0.6;
    return v;
  });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < sel.length; i++) { r -= w[i]; if (r <= 0) { s.last = sel[i]; return sel[i]; } }
  s.last = sel[sel.length - 1];
  return s.last;
}
function recordItem(modeId, sid, item, ok, given, ms) {
  const st = statsOf(sid), k = String(item);
  const x = st.s[k] || (st.s[k] = { a: 0, c: 0, r: '', t: 0 });
  x.a++; if (ok) x.c++;
  x.r = (x.r + (ok ? '1' : '0')).slice(-20);
  if (ok && ms && ms < 15000) x.t = x.t ? Math.round(x.t * 0.8 + ms * 0.2) : Math.round(ms);
  if (!ok && given != null && String(given) !== k) {
    const cf = st.conf[k] || (st.conf[k] = {});
    cf[String(given)] = (cf[String(given)] || 0) + 1;
  }
  const d = dayRec(true);
  d.n++; if (ok) d.c++;
  d.g = DB.settings.goal;
  const mm = d.m[modeId] || (d.m[modeId] = [0, 0]);
  mm[0]++; if (ok) mm[1]++;
  if (d.n === DB.settings.goal) setTimeout(() => toast('Цель на сегодня выполнена'), 900);
}
function checkLevel() {
  const { mode: m, c, s } = P;
  if (P.drill || !c.auto) return;
  if (m.autoStep) { m.autoStep(s, c); return; }
  const next = m.levels(c).find(x => !P.sel.includes(x) && m.allItems(c).includes(x));
  if (next == null) return;
  const w = s.win.slice(-20);
  if (w.length < Math.max(12, P.sel.length * 3)) return;
  if (w.filter(Boolean).length / w.length < 0.9) return;
  P.sel.push(next);
  s.win = [];
  s.unlocked.push(next);
  P.rebuild = true;
  const sub = m.itemSub(next, c);
  toast(`Добавлено: ${unitOf(m, c)} ${m.itemLabel(next, c)}${sub ? ' (' + sub + ')' : ''}`);
}

/* =========================================================
   Practice controller
   ========================================================= */
const P = { mode: null, c: null, sel: null, sid: null, s: null, q: null, phase: 'idle', ui: {}, listen: false, drill: false, rebuild: false };

async function startSession(modeId, opts = {}) {
  const m = MODES[modeId];
  let c = cfgOf(m);
  P.drill = !!opts.sel;
  if (P.drill) c = Object.assign({}, c, opts.override || {}, { auto: false });
  P.mode = m; P.c = c;
  P.sel = P.drill ? opts.sel.slice() : selOf(m, c);
  P.sid = statsId(m, c);
  P.s = { qi: 0, total: 0, correct: 0, items: 0, itemsOk: 0, streak: 0, best: 0, requeue: [], last: null, win: [], qwin: [], key: null, sinceKey: 0, res: {}, unlocked: [], times: [], lastAt: Date.now() };
  P.q = null; P.phase = 'loading'; P.rebuild = false; P.listen = false;
  if (!P.drill) { DB.last = m.id; save(); }
  buildPractice();
  show('practice');
  setFeedback('wait', 'Загрузка звука…', '');
  await AudioEngine.ready();
  if (P.mode !== m || P.phase !== 'loading') return;
  if (m.answer === 'sing') {
    setFeedback('wait', 'Включаю микрофон…', '');
    try { await Mic.start(onPitch); }
    catch (e) {
      P.phase = 'idle';
      const insecure = location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1';
      setFeedback('bad', 'Нет доступа к микрофону', insecure ? 'нужен адрес с https://' : 'разреши микрофон для этого сайта');
      return;
    }
    if (P.mode !== m) { Mic.stop(); return; }
  }
  nextQuestion();
}

async function nextQuestion() {
  const { mode: m, c, s } = P;
  if (!m) return;
  if (c.count && s.total >= c.count) { finishSession(); return; }
  AudioEngine.stopAll();
  P.listen = false;
  s.qi++;
  const q = m.newQ(s, c, P.sel);
  q.pre = q.pre || 0;
  q.given = q.targets.slice(0, q.pre);
  q.replays = 0; q.results = null; q.ok = null; q.hinted = false;
  P.q = q; P.phase = 'listening';
  const t = ansType();
  if (P.rebuild || t === 'sing' || (t === 'piano' && m.id === 'dictation')) { P.rebuild = false; buildAnswer(); }
  else clearMarks();
  renderHead(); renderSeq();
  setFeedback('wait', m.listenText ? m.listenText(q, c) : 'Слушай', '');
  renderControls();
  const ok = await m.playQ(q, c, 'first');
  if (!ok || P.q !== q || P.phase !== 'listening') return;
  if (m.answer === 'sing') { await sleep(250); if (P.q !== q || P.phase !== 'listening') return; }
  toAnswering(q);
}

function toAnswering(q) {
  if (P.q !== q) return;
  const m = P.mode;
  q.t0 = performance.now();
  setFeedback('', m.prompt(q, P.c), m.promptSub ? m.promptSub(q, P.c) : '');
  if (m.answer === 'sing') {
    P.phase = 'singing';
    AudioEngine.stopAll();
    q.hold = 0; q.lastT = performance.now(); q.gap = 0;
    P.listen = true;
    P.ui.fbSub.textContent = 'пой, я слушаю';
  } else P.phase = 'answering';
  renderControls();
}

async function replay(how = 'again') {
  const { mode: m, c, q } = P;
  if (!q || P.phase === 'loading' || P.phase === 'idle') return;
  const lim = c.replays && c.replays !== 'inf' ? Number(c.replays) : null;
  if (how === 'again' && lim != null && P.phase !== 'answered') {
    if (q.replays >= lim) return;
    q.replays++;
    renderControls();
  }
  if (m.answer === 'sing') {
    const wasSinging = P.phase === 'singing';
    P.listen = false;
    const ok = await m.playQ(q, c, how);
    if (ok && wasSinging && P.q === q && P.phase === 'singing') { await sleep(250); if (P.q === q && P.phase === 'singing') { AudioEngine.stopAll(); q.hold = 0; q.lastT = performance.now(); P.listen = true; } }
    if (ok && P.q === q && P.phase === 'listening') toAnswering(q);
    return;
  }
  const ok = await m.playQ(q, c, how);
  if (ok && P.q === q && P.phase === 'listening') toAnswering(q);
}

function playTonic() {
  const q = P.q;
  if (q && q.key) AudioEngine.play([{ m: q.key.t, at: 0, dur: 1.2, vel: 0.8 }]);
}

function input(id) {
  const { mode: m, c, q } = P;
  if (!q || P.phase !== 'answering') return;
  const item = m.toItem ? m.toItem(id, q, c) : id;
  if (q.targets.length === 1) {
    q.given = [item];
    if (m.tapSound) m.tapSound(item, q, 0, c);
    evaluate();
    return;
  }
  const pos = q.given.length;
  if (pos >= q.targets.length) return;
  q.given.push(item);
  if (m.tapSound) m.tapSound(item, q, pos, c);
  renderSeq();
  if (q.given.length === q.targets.length) evaluate();
  else renderControls();
}
function backspace() {
  const q = P.q;
  if (!q || P.phase !== 'answering' || q.given.length <= q.pre) return;
  q.given.pop();
  renderSeq(); renderControls();
}

function evaluate() {
  const { mode: m, c, s, q } = P;
  P.phase = 'answered';
  P.listen = false;
  const single = q.targets.length === 1;
  const ms = single && q.t0 ? performance.now() - q.t0 : null;
  let errs = 0;
  q.results = q.targets.map((t, i) => {
    if (i < q.pre) return null;
    const g = q.given[i];
    const ok = g === t && !q.hinted;
    recordItem(m.id, P.sid, t, ok, g, ms);
    s.items++; if (ok) s.itemsOk++;
    const r = s.res[t] || (s.res[t] = { a: 0, c: 0 });
    r.a++; if (ok) r.c++;
    s.win.push(ok);
    if (!ok) { errs++; s.requeue.push({ item: t, due: s.qi + 2 + rand(3) }); }
    return ok;
  });
  if (s.requeue.length > 6) s.requeue.splice(0, s.requeue.length - 6);
  q.ok = errs === 0;
  s.total++;
  if (q.ok) { s.correct++; s.streak++; s.best = Math.max(s.best, s.streak); } else s.streak = 0;
  s.qwin.push(q.ok);
  if (ms != null && q.ok) s.times.push(ms);
  const now = Date.now(), d = dayRec(true);
  d.sec += Math.min(45, (now - s.lastAt) / 1000);
  s.lastAt = now;
  markAnswer(q);
  renderSeq(); renderHead();
  const [main, sub] = m.feedback(q, c, q.ok);
  setFeedback(q.ok ? 'ok' : 'bad', main, sub);
  checkLevel();
  save();
  renderControls();
  (async () => {
    const r = m.after ? m.after(q, c, q.ok) : null;
    if (r) await r;
    if (P.q !== q || P.phase !== 'answered') return;
    if (q.ok && DB.settings.autoAdvance) {
      await sleep(r ? 300 : 650);
      if (P.q === q && P.phase === 'answered') nextQuestion();
    }
  })();
}

function stopPractice() {
  AudioEngine.stopAll();
  if (Mic.on) Mic.stop();
  P.listen = false;
  P.phase = 'idle';
  P.q = null;
}
function finishSession() {
  const had = P.s && P.s.total;
  stopPractice();
  save();
  if (!had) { renderHome(); show('home'); return; }
  renderSummary();
  show('summary');
}

/* ---------- singing ---------- */
function onPitch(midi) {
  const q = P.q;
  if (!q || !P.mode || P.mode.answer !== 'sing') return;
  const lad = P.ui.answer && P.ui.answer.querySelector('.ladder');
  const mk = lad && lad.querySelector('.marker');
  if (P.phase !== 'singing' || !P.listen) { if (mk) mk.hidden = true; return; }
  const now = performance.now();
  const dt = Math.min(100, now - (q.lastT || now));
  q.lastT = now;
  if (midi == null) {
    q.gap += dt;
    if (q.gap > 200) q.hold = Math.max(0, q.hold - dt);
    if (mk) mk.hidden = true;
    if (q.gap > 400) P.ui.fbSub.textContent = 'пой, я слушаю';
    setHold(q.hold / HOLD_MS);
    return;
  }
  q.gap = 0;
  const { rel, cents } = P.mode.singPos(q, midi);
  const inTol = Math.abs(cents) <= P.c.tol;
  if (mk) {
    const max = +lad.dataset.max, min = +lad.dataset.min;
    const y = max - clamp(rel, min - 0.5, max + 0.5);
    mk.hidden = false;
    mk.style.top = `calc(${y.toFixed(3)} * var(--u) + (var(--u) - 4px) / 2 - 1px)`;
    mk.dataset.ok = inTol ? '1' : '0';
  }
  const heard = cap(noteName(Math.round(midi)));
  const a = Math.abs(cents);
  P.ui.fbSub.textContent = a <= 100 ? `слышу ${heard}, ${cents > 0 ? '+' : cents < 0 ? '−' : ''}${a}¢` : `слышу ${heard}, ${cents > 0 ? 'выше' : 'ниже'} цели`;
  if (inTol) q.hold += dt; else q.hold = Math.max(0, q.hold - dt * 1.5);
  setHold(q.hold / HOLD_MS);
  if (q.hold >= HOLD_MS) {
    P.listen = false;
    q.cents = cents;
    q.given = [q.targets[0]];
    if (mk) mk.hidden = true;
    evaluate();
  }
}
function setHold(f) {
  const r = P.ui.answer && P.ui.answer.querySelector('.rung.target .fill');
  if (r) r.style.transform = `scaleX(${clamp(f, 0, 1).toFixed(3)})`;
}
async function singHint() {
  const q = P.q;
  if (!q || P.phase !== 'singing') return;
  q.hinted = true;
  P.listen = false;
  const ok = await P.mode.hintSound(q);
  if (ok && P.q === q && P.phase === 'singing') { await sleep(250); if (P.q === q && P.phase === 'singing') { AudioEngine.stopAll(); q.hold = 0; q.lastT = performance.now(); P.listen = true; } }
}
function singSkip() {
  const q = P.q;
  if (!q || P.phase !== 'singing') return;
  P.listen = false;
  q.given = [null];
  evaluate();
}

function buildAnswer() {
  const m = P.mode, c = P.c, a = P.ui.answer, t = ansType();
  a.replaceChildren();
  if (t === 'ladder') a.append(buildLadder(m.rows(c, P.sel), true));
  else if (t === 'grid') a.append(buildGrid());
  else if (t === 'piano') a.append(buildPiano());
  else if (t === 'sing' && P.q) a.append(buildLadder(m.rows(c, P.sel, P.q), false));
}

function buildLadder(rows, interactive) {
  const min = Math.min(...rows.map(r => r.pos)), max = Math.max(...rows.map(r => r.pos));
  const box = h('div', { class: 'ladder', style: `--span:${max - min}`, 'data-min': min, 'data-max': max, role: interactive ? 'group' : null, 'aria-label': interactive ? 'Варианты ответа' : null });
  for (let p = min; p <= max; p++) box.append(h('i', { class: 'staff', style: `top:calc(${max - p} * var(--u) + (var(--u) - 4px) / 2)` }));
  rows.forEach(r => {
    const cls = 'rung' + (r.chroma ? ' chroma' : '') + (r.enabled === false ? ' off' : '') + (r.target ? ' target' : '');
    const kids = [h('span', { class: 'num' }, r.label), interactive && r.enabled !== false && r.hkl ? h('span', { class: 'kbd' }, r.hkl) : null, h('span', { class: 'fill' })];
    const props = { class: cls, style: `top:calc(${max - r.pos} * var(--u))`, 'data-id': String(r.id), 'data-pos': r.pos, title: r.title || null };
    if (interactive) {
      Object.assign(props, { type: 'button', 'data-hk': r.enabled === false ? null : r.hk, disabled: r.enabled === false, 'aria-label': `${r.label}${r.title ? ', ' + r.title : ''}`, onclick: () => input(r.id) });
      box.append(h('button', props, kids));
    } else box.append(h('div', props, kids));
  });
  if (!interactive) box.append(h('div', { class: 'marker', hidden: true }));
  return box;
}
function lightRow(pos) {
  const a = P.ui.answer;
  if (!a) return;
  a.querySelectorAll('.rung.lit').forEach(e => e.classList.remove('lit'));
  if (pos != null) a.querySelectorAll(`.rung[data-pos="${pos}"]`).forEach(e => e.classList.add('lit'));
}

function buildGrid() {
  const m = P.mode, c = P.c, box = h('div', { class: 'grid' });
  const items = m.allItems(c).filter(x => P.sel.includes(x));
  let i = 0, prevGroup = null;
  items.forEach(it => {
    const g = CHORDS[it] ? CHORDS[it].g : '';
    if (prevGroup !== null && g !== prevGroup) box.append(h('i', { class: 'g-sep' }));
    prevGroup = g;
    box.append(h('button', { type: 'button', class: 'gbtn', 'data-id': it, 'data-hk': HK_SEQ[i] || null, title: m.itemSub(it, c) || null, onclick: () => input(it) },
      m.itemLabel(it, c), HK_LBL[i] ? h('span', { class: 'kbd' }, HK_LBL[i]) : null));
    i++;
  });
  return box;
}

const PIANO_HK = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY', 'KeyH', 'KeyU', 'KeyJ'];
const PIANO_HKL = 'AWSEDFTGYHUJ';
function buildPiano() {
  const q = P.q, flats = q && q.key ? keyFlats(q.key.pc, q.key.scale) : false;
  const wrap = h('div', { class: 'piano', role: 'group', 'aria-label': 'Клавиатура' });
  [0, 2, 4, 5, 7, 9, 11].forEach(pc => wrap.append(h('button', { type: 'button', class: 'wk', 'data-id': pc, 'data-hk': PIANO_HK[pc], 'aria-label': cap(noteName(pc, flats)), onclick: () => pianoPress(pc) },
    h('span', {}, cap(noteName(pc, flats))), h('span', { class: 'kbd' }, PIANO_HKL[pc]))));
  [[1, 0], [3, 1], [6, 3], [8, 4], [10, 5]].forEach(([pc, wi]) => wrap.append(h('button', { type: 'button', class: 'bk', 'data-id': pc, 'data-hk': PIANO_HK[pc], 'aria-label': cap(noteName(pc, flats)), style: `left:calc(8px + (100% - 16px) * ${(wi + 1) / 7} - 4.5%)`, onclick: () => pianoPress(pc) },
    h('span', {}, cap(noteName(pc, flats))), h('span', { class: 'kbd' }, PIANO_HKL[pc]))));

function pianoPress(pc) {
  const el = P.ui.answer.querySelector(`[data-id="${pc}"]`);
  if (el) { el.classList.add('press'); setTimeout(() => el.classList.remove('press'), 150); }
  if (P.phase === 'answering') { input(pc); return; }

  AudioEngine.tap(m.freeSound ? m.freeSound(pc, P.q) : 60 + pc, 0.7, 0.72, P.q && P.q.timbre);

function clearMarks() {
  const a = P.ui.answer;
  if (a) a.querySelectorAll('.good,.bad,.reveal,.lit,.press').forEach(e => e.classList.remove('good', 'bad', 'reveal', 'lit', 'press'));
}
function markAnswer(q) {
  const a = P.ui.answer, t = ansType();
  if (!a || q.targets.length !== 1 || t === 'sing' || (t === 'piano' && P.mode.id === 'dictation')) return;
  a.querySelectorAll(`[data-id="${CSS.escape(String(q.given[0]))}"]`).forEach(e => e.classList.add(q.ok ? 'good' : 'bad'));
  if (!q.ok) a.querySelectorAll(`[data-id="${CSS.escape(String(q.targets[0]))}"]`).forEach(e => e.classList.add('reveal'));

function renderSeq() {
  const box = P.ui.seq, q = P.q, m = P.mode, c = P.c;
  if (!box) return;
  if (!q || q.targets.length < 2) { box.hidden = true; return; }
  box.hidden = false;
  const done = P.phase === 'answered';
  box.className = 'seq' + (done && !q.ok ? ' done' : '');
  box.replaceChildren();
  q.targets.forEach((t, i) => {
    const g = q.given[i], cls = ['pill'];
    if (i < q.pre) cls.push('given');
    else if (done) cls.push(q.results[i] ? 'ok' : 'bad');
    else if (g == null) cls.push(i === q.given.length ? 'empty cur' : 'empty');
    const main = g == null ? (done ? m.itemLabel(t, c, q) : '') : m.itemLabel(g, c, q);
    box.append(h('div', { class: cls.join(' ') }, main, done && i >= q.pre && !q.results[i] ? h('small', {}, m.itemLabel(t, c, q)) : null));
  });
}

function renderHead() {
  const { mode: m, c, s, q } = P, ui = P.ui;
  if (!ui.sub) return;
  const showKey = q && q.key && (P.phase === 'answered' || (m.showKey && m.showKey(c)));
  const parts = [];
  if (showKey) parts.push(keyName(q.key.pc, q.key.scale));
  if (s.total) parts.push(`верно ${s.correct} из ${s.total}`);
  else if (c.count) parts.push(`${c.count} ${plural(c.count, 'вопрос', 'вопроса', 'вопросов')}`);
  ui.sub.textContent = parts.join(', ') || '\u00a0';
  if (c.count) ui.bar.firstChild.style.width = pct(s.total, c.count) + '%';
}
function setFeedback(kind, main, sub) {

function renderControls() {
  const { mode: m, c, q } = P, ph = P.phase, box = P.ui.ctl;

  box.replaceChildren();
  if (!q) return;
  const act = (ic, label, hk, hkl, fn, o = {}) => h('button', { type: 'button', class: 'act' + (o.primary ? ' primary' : ''), 'data-hk': hk, disabled: !!o.disabled, onclick: fn },
    ic ? icon(ic) : null, h('span', {}, label), hkl ? h('span', { class: 'kbd' }, hkl) : null);
  if (m.answer === 'sing') {
    box.append(act('replay', 'Ещё раз', 'Space', 'Пробел', () => replay()));
    if (ph === 'singing') box.append(act('hint', 'Подсказка', 'KeyH', 'H', singHint), act(null, 'Пропустить', 'Enter', 'Enter', singSkip, { primary: true }));
    if (ph === 'answered') box.append(act(null, 'Дальше', 'Enter', 'Enter', nextQuestion, { primary: true }));
    return;
  }
  const lim = c.replays && c.replays !== 'inf' ? Number(c.replays) : null;
  const limited = lim != null && ph !== 'answered';
  const left = limited ? lim - q.replays : null;
  box.append(act('replay', limited ? `Ещё ${left}` : 'Ещё раз', 'Space', 'Пробел', () => replay(), { disabled: limited && left <= 0 }));
  if (m.keyCtx) box.append(act('cadence', 'Каденция', 'KeyK', 'K', () => replay('context')));

  if (ph === 'answered') box.append(act(null, 'Дальше', 'Enter', 'Enter', nextQuestion, { primary: true }));

/* ---------- keyboard ---------- */
let VIEW = 'home';
document.addEventListener('keydown', e => {
  if (sheetOpen()) { if (e.code === 'Escape') { e.preventDefault(); closeSheet(); } return; }
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  let code = e.code || '';
  if (code === 'NumpadEnter') code = 'Enter';
  if (/^Numpad\d$/.test(code)) code = 'Digit' + code.slice(6);
  if (code === 'NumpadSubtract') code = 'Minus';
  if (VIEW === 'summary' && code === 'Enter') { const b = $('#v-summary [data-hk="Enter"]'); if (b) { e.preventDefault(); b.click(); } return; }
  if (VIEW !== 'practice') return;

let sheetOnClose = null, sheetReturn = null;

function openSheet(title, body, opts = {}) {

function keysText(m) {

/* =========================================================
   Data helpers
   ========================================================= */
function dayStreak() {
  const g = DB.settings.goal, met = x => x && x.n >= (x.g || g);
  const d = new Date();
  let k = met(DB.days[dayKey(d)]) ? 1 : 0;
  for (let i = 0; i < 1000; i++) { d.setDate(d.getDate() - 1); if (met(DB.days[dayKey(d)])) k++; else break; }
  return k;
}
function rangeDays(n) {
  let a = 0, c = 0, sec = 0;
  const d = new Date();
  for (let i = 0; i < n; i++) { const x = DB.days[dayKey(d)]; if (x) { a += x.n; c += x.c; sec += x.sec || 0; } d.setDate(d.getDate() - 1); }
  return { a, c, sec };
}
function variantsWithData(m) {
  return Object.keys(DB.stats).filter(k => (k === m.id || k.startsWith(m.id + ':')) && Object.keys(DB.stats[k].s).length)
    .map(k => { const v = k.includes(':') ? k.slice(m.id.length + 1) : null; return { sid: k, v, c: Object.assign(JSON.parse(JSON.stringify(m.defaults)), m.fromVariant && v ? m.fromVariant(v) : {}) }; });
}
function confusionsOf(m, sid, v, c, minN) {
  const out = [], cf = DB.stats[sid].conf || {};
  for (const t in cf) for (const g in cf[t]) if (cf[t][g] >= minN) out.push({ m, v, c, t: parseItem(m, t), g: parseItem(m, g), n: cf[t][g] });
  return out.sort((a, b) => b.n - a.n);
}
function topConfusion() {
  let best = null;
  MODE_ORDER.forEach(id => variantsWithData(MODES[id]).forEach(({ sid, v, c }) => {
    const x = confusionsOf(MODES[id], sid, v, c, 3)[0];
    if (x && (!best || x.n > best.n)) best = x;
  }));
  return best;
}
function drill(x) { startSession(x.m.id, { sel: [x.t, x.g], override: x.m.fromVariant && x.v ? x.m.fromVariant(x.v) : {} }); }
const confLabel = x => [x.m.itemLabel(x.t, x.c), x.m.itemLabel(x.g, x.c)];

function ring(n, goal) {
  const r = 26, C = 2 * Math.PI * r, f = Math.min(1, n / goal);
  const wrap = h('div', { class: 'ring' + (f >= 1 ? ' done' : ''), 'aria-label': `Сегодня ${n} из ${goal}` });
  wrap.innerHTML = `<svg viewBox="0 0 62 62"><circle class="bg" cx="31" cy="31" r="${r}"/><circle class="fg" cx="31" cy="31" r="${r}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - f)).toFixed(1)}"/></svg>`;
  wrap.append(h('b', {}, n));
  return wrap;
}
function renderHome() {
  const v = $('#v-home');
  const goal = DB.settings.goal, today = dayRec(false), n = today ? today.n : 0;
  const streak = dayStreak(), week = rangeDays(7);

  const weak = topConfusion();
  if (weak) {

    parts.push(h('div', { class: 'weak' }, h('span', {}, 'Путаешь ', h('b', {}, a), ' и ', h('b', {}, b)),

        h('h3', {}, m.title),

/* =========================================================
   Progress
   ========================================================= */
let chartFilter = 'all';
function chartSVG(filter) {
  const days = [], d = new Date();
  d.setDate(d.getDate() - 29);
  for (let i = 0; i < 30; i++) {
    const k = dayKey(d), x = DB.days[k];
    let n = 0, c = 0;
    if (x) { if (filter === 'all') { n = x.n; c = x.c; } else if (x.m && x.m[filter]) { n = x.m[filter][0]; c = x.m[filter][1]; } }
    days.push({ n, c, day: d.getDate(), mon: d.getMonth() + 1 });
    d.setDate(d.getDate() + 1);
  }
  const goal = DB.settings.goal;
  const max = Math.max(10, ...days.map(x => x.n), filter === 'all' ? goal * 1.15 : 0);
  const W = 600, H = 170, pb = 22, pt = 8, bw = W / 30, ih = H - pb - pt;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ответы за 30 дней">`;
  days.forEach((x, i) => {
    const xx = i * bw + 2, w = bw - 4, date = `${x.day}.${String(x.mon).padStart(2, '0')}`;
    if (!x.n) svg += `<rect class="zero" x="${xx}" y="${H - pb - 2}" width="${w}" height="2" rx="1"><title>${date}: нет занятий</title></rect>`;
    else {
      const hh = Math.max(3, (x.n / max) * ih), a = x.c / x.n;
      svg += `<rect class="bar ${lvl(a)}" x="${xx}" y="${H - pb - hh}" width="${w}" height="${hh}" rx="2"><title>${date}: ${x.n} ${plural(x.n, 'ответ', 'ответа', 'ответов')}, ${Math.round(a * 100)}%</title></rect>`;
    }
    if (i === 29) svg += `<text x="${W}" y="${H - 6}" text-anchor="end">сегодня</text>`;
    else if (i % 5 === 4 && i < 25) svg += `<text x="${xx + w / 2}" y="${H - 6}" text-anchor="middle">${x.day}</text>`;
  });
  if (filter === 'all') { const y = H - pb - (goal / max) * ih; svg += `<line class="goal" x1="0" x2="${W}" y1="${y}" y2="${y}"/><text x="${W - 2}" y="${y - 5}" text-anchor="end">цель</text>`; }
  return svg + '</svg>';
}
function renderProgress() {
  const v = $('#v-progress');
  const today = dayRec(false), week = rangeDays(7);
  let total = 0;
  Object.values(DB.days).forEach(x => { total += x.n; });
  const kpis = h('div', { class: 'kpis' },
    h('div', { class: 'kpi' }, h('span', {}, 'Сегодня'), h('b', {}, today ? today.n : 0)),
    h('div', { class: 'kpi' }, h('span', {}, 'Дней подряд'), h('b', {}, dayStreak())),

  const filter = h('select', { class: 'sel', 'aria-label': 'Режим' }, h('option', { value: 'all' }, 'Все режимы'),
    MODE_ORDER.map(id => h('option', { value: id, selected: chartFilter === id }, MODES[id].title)));
  const chart = h('div', { class: 'chart', html: chartSVG(chartFilter) });
  filter.addEventListener('change', () => { chartFilter = filter.value; chart.innerHTML = chartSVG(chartFilter); });
  const cards = [];
  MODE_ORDER.forEach(id => {

      const cells = h('div', { class: 'cells' }, m.allItems(c).map(it => {
        const x = st.s[String(it)], acc = itemAcc(x);
        return h('div', { class: 'cell', 'data-l': lvl(acc), title: x ? `${m.itemSub(it, c) ? cap(m.itemSub(it, c)) + '. ' : ''}Верно ${x.c} из ${x.a}${x.t ? ', ' + fmtSec(x.t) : ''}` : 'Ещё не было' },
          h('b', {}, m.itemLabel(it, c)), h('small', {}, acc == null ? '—' : Math.round(acc * 100) + '%'));
      }));
      const confs = confusionsOf(m, sid, vr, c, 2).slice(0, 2).map(x => {
        const [p, q] = confLabel(x);
        return h('div', { class: 'conf-row' }, h('span', {}, 'Путаешь ', h('b', {}, p), ' и ', h('b', {}, q), `, ${x.n} ${plural(x.n, 'раз', 'раза', 'раз')}`),
          h('button', { type: 'button', class: 'btn small', onclick: () => drill(x) }, 'Тренировать'));
      });
      cards.push(h('div', { class: 'card' },
        h('div', { class: 'card-head' }, h('h3', {}, m.title + (vr && m.variantName ? ', ' + m.variantName(vr) : '')), h('span', {}, `${pct(cc, a)}%, ${a} ${plural(a, 'ответ', 'ответа', 'ответов')}`)),
        cells, confs));
    });
  });
  v.replaceChildren(h('h1', { class: 'page-title' }, 'Прогресс'), kpis,
    h('div', { class: 'card' }, h('div', { class: 'card-head' }, h('h3', {}, '30 дней'), filter), chart),
    cards.length ? h('div', {}, cards) : h('p', { class: 'empty' }, 'Пока пусто. Начни любую тренировку.'));

      field('Темп', seg([['slow', 'Медленно'], ['mid', 'Средне'], ['fast', 'Быстро']], S.tempo, val => set('tempo', val))),
      field('Цель в день', seg([[20, '20'], [50, '50'], [100, '100'], [200, '200']], S.goal, val => set('goal', val)))),
    status ? h('p', { class: 'status', id: 'sndStatus' }, status) : h('p', { class: 'status', id: 'sndStatus', hidden: true }),
    h('div', { class: 'list' },
      switchRow('Сразу дальше после верного ответа', S.autoAdvance, val => set('autoAdvance', val, true)),
      switchRow('Чаще давать слабые места', S.adaptive, val => set('adaptive', val, true))),
    h('div', { class: 'list' },
      h('div', { class: 'row' }, h('span', { class: 'lab' }, 'Прогресс'), h('div', { class: 'chips' },
        h('button', { type: 'button', class: 'btn small', onclick: exportData }, 'Сохранить в файл'),
        h('button', { type: 'button', class: 'btn small', onclick: () => file.click() }, 'Загрузить'))),
      h('div', { class: 'row' }, h('span', { class: 'lab' }, 'Статистика'), h('button', { type: 'button', class: 'btn small quiet', onclick: resetStats }, 'Сбросить')), file)));
}
function exportData() {
  writeNow();
  const blob = new Blob([JSON.stringify(DB)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `notes-progress-${dayKey()}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function importData(f) {
  f.text().then(t => {
    const d = JSON.parse(t);
    if (!d || typeof d !== 'object' || !d.stats || !d.days) throw new Error('bad');
    if (!confirm('Заменить текущий прогресс данными из файла?')) return;
    DB.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings);
    DB.cfg = d.cfg || {}; DB.stats = d.stats; DB.days = d.days; DB.last = d.last || null; DB.seen = d.seen || {};
    delete DB.migrated;
    writeNow(); applyTheme(); renderSettings();
    toast('Прогресс загружен');
  }).catch(() => toast('Это не файл прогресса Notes'));
}
function resetStats() {
  if (!confirm('Удалить всю статистику? Настройки останутся.')) return;
  DB.stats = {}; DB.days = {}; DB.last = null; delete DB.migrated;
  writeNow();
  toast('Статистика сброшена');
}
function renderSnd(i) {
  const el = $('#sndStatus');
  if (!el) return;
  const t = soundStatus(i);
  el.textContent = t;
  el.hidden = !t;
}

/* =========================================================
   Init
   ========================================================= */
function navigate(to) {
  closeSheet();
  if (VIEW === 'practice') { stopPractice(); save(); }
  if (to === 'home') renderHome();
  if (to === 'progress') renderProgress();
  if (to === 'settings') renderSettings();
  show(to);
}
$$('[data-nav]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.nav)));
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => AudioEngine.unlock(), { once: true, capture: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { AudioEngine.stopAll(); P.listen = false; return; }
  if (!sheetOpen()) resumePractice();
});
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);
}
applyTheme();
AudioEngine.onState(renderSnd);
AudioEngine.prefetch();
renderHome();
show('home');

</script>
</body>
</html>
