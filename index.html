<style>
:root{
  --mc:#3B4FE0;
  --bg:#F3F4FA;--surface:#FFFFFF;--surface2:#F8F9FD;--sunk:#E9EBF5;--ink:#141833;--ink2:#5A6080;--ink3:#9297B2;
  --line:#E2E4F0;--line2:#CDD0E1;
  --brand:#3B4FE0;--brand-d:#2A39B0;--brand-soft:rgba(59,79,224,.1);--on-brand:#fff;
  --ok:#1FB873;--ok-d:#148A55;--ok-soft:#E1F7EC;--ok-ink:#0E7A48;
  --bad:#F0505A;--bad-d:#C23540;--bad-soft:#FDE7E8;--bad-ink:#B42833;
  --gold:#FFB020;--gold-d:#D98A00;
  --sh1:0 1px 2px rgba(20,24,51,.05),0 6px 18px rgba(20,24,51,.06);
  --sh2:0 2px 6px rgba(20,24,51,.06),0 18px 40px rgba(20,24,51,.12);
  --scrim:rgba(13,15,30,.45);--staff:rgba(20,24,51,.06);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --u:40px;
  --btn-bg:#EEF0F8;--btn-line:#C9CDE0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F1E;--surface:#171A30;--surface2:#1C2039;--sunk:#242848;--ink:#F2F3FA;--ink2:#A9AECB;--ink3:#6F7497;
  --line:#282C4C;--line2:#363B61;
  --brand:#6B7BFF;--brand-d:#4655D6;--brand-soft:rgba(107,123,255,.16);--on-brand:#fff;
  --ok:#2BCB85;--ok-d:#1A9A62;--ok-soft:rgba(43,203,133,.15);--ok-ink:#5BE0A6;
  --bad:#FF5F69;--bad-d:#C93F48;--bad-soft:rgba(255,95,105,.15);--bad-ink:#FF8A92;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);--sh2:0 4px 10px rgba(0,0,0,.35),0 24px 50px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6);--staff:rgba(255,255,255,.05);--btn-bg:#2A2F55;--btn-line:#474D7E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F1E;--surface:#171A30;--surface2:#1C2039;--sunk:#242848;--ink:#F2F3FA;--ink2:#A9AECB;--ink3:#6F7497;
  --line:#282C4C;--line2:#363B61;
  --brand:#6B7BFF;--brand-d:#4655D6;--brand-soft:rgba(107,123,255,.16);--on-brand:#fff;
  --ok:#2BCB85;--ok-d:#1A9A62;--ok-soft:rgba(43,203,133,.15);--ok-ink:#5BE0A6;
  --bad:#FF5F69;--bad-d:#C93F48;--bad-soft:rgba(255,95,105,.15);--bad-ink:#FF8A92;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);--sh2:0 4px 10px rgba(0,0,0,.35),0 24px 50px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6);--staff:rgba(255,255,255,.05);--btn-bg:#2A2F55;--btn-line:#474D7E;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}

.app{max-width:900px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px))}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:60px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.brand svg{width:28px;height:24px}
.brand b{font-weight:500;margin-left:.28em;color:var(--brand)}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:16px;box-shadow:var(--sh1)}
.tabs button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14px;transition:background .15s,color .15s}
.tabs button[aria-current=page]{color:var(--on-brand);background:var(--brand)}
body[data-view=practice] .top,body[data-view=summary] .top,body[data-view=welcome] .top{display:none}

/* ---------- buttons ---------- */
/* Secondary buttons sit on a tinted fill with a visible outline, so they never merge with cards or the page. */
.btn{--bt:var(--btn-bg);display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:700;font-size:16px;background:var(--bt);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--btn-line),0 4px 0 var(--btn-line);transition:transform .06s,box-shadow .06s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px var(--btn-line),0 1px 0 var(--btn-line)}
.btn:disabled{opacity:.5}
.btn svg.i{width:20px;height:20px}
.btn.go{background:var(--brand);color:var(--on-brand);box-shadow:0 4px 0 var(--brand-d),0 8px 20px color-mix(in srgb,var(--brand) 30%,transparent)}
.btn.go:active{box-shadow:0 1px 0 var(--brand-d)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.btn.ghost{background:var(--btn-bg)}
.btn.small{min-height:40px;padding:0 15px;font-size:14px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--btn-line),0 3px 0 var(--btn-line)}
.btn.small:active{box-shadow:inset 0 0 0 1.5px var(--btn-line),0 0 0 var(--btn-line)}
.btn.small.go{box-shadow:0 3px 0 var(--brand-d)}
.btn.small svg.i{width:17px;height:17px}
.btn.wide{width:100%}
.kbd{font:600 10.5px/1 var(--sans);padding:3px 5px;border:1.5px solid currentColor;border-radius:6px;opacity:.5;white-space:nowrap}
@media (hover:none),(pointer:coarse){.kbd,.kb-only{display:none!important}}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink2);flex:none;transition:background .15s}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.round{border-radius:50%;background:var(--surface);box-shadow:0 3px 0 var(--line2)}
.link{color:var(--brand);font-size:14px;font-weight:600}

/* ---------- form controls ---------- */
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--sunk);padding:4px;border-radius:13px;max-width:100%}
.seg button{padding:7px 12px;border-radius:10px;font-size:14px;color:var(--ink2);font-weight:600;transition:background .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(20,24,51,.12)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
select.sel{padding:9px 12px;border-radius:12px;border:0;background:var(--sunk);font-size:14px;font-weight:600}
input[type=range]{width:min(220px,100%);accent-color:var(--brand)}
.name-inp{width:100%;height:56px;padding:0 18px;border-radius:16px;border:2px solid var(--line2);background:var(--surface);font-size:18px;font-weight:600;outline:none;transition:border-color .15s}
.name-inp:focus{border-color:var(--brand)}
.name-inp.sm{height:46px;font-size:16px;flex:1;min-width:0}

.list{background:var(--surface);border-radius:20px;box-shadow:var(--sh1);overflow:hidden}
.list+.list{margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 14px;padding:12px 16px;min-height:58px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row>.lab{font-size:15px;font-weight:600}
.row.stack{flex-direction:column;align-items:stretch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{--c:var(--brand);position:relative;min-width:50px;height:46px;padding:0 12px;border-radius:13px;background:var(--sunk);font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink3);overflow:hidden;transition:transform .08s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#000)}
.chip.word{font-family:var(--sans);font-size:14px}
.mb{position:absolute;left:0;bottom:0;height:4px;width:var(--p,0%);background:rgba(255,255,255,.75)}
.chip[aria-pressed=false] .mb{background:var(--ink3)}
.chips-lab{font-size:13px;color:var(--ink3);font-weight:600;margin-bottom:8px}
.chips+.chips-lab{margin-top:14px}
.links{display:flex;gap:20px;margin-top:12px}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:15px;font-weight:600;transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:70;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--sh2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:80}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:86vh;overflow:auto;border-radius:28px;padding:0 18px;box-shadow:var(--sh2);animation:up .28s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{display:none}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 12px;background:var(--bg)}
.sheet-head h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet .text{color:var(--ink2);font-size:16px;line-height:1.55}
.sheet .text+.text{margin-top:10px}
.sheet .text b{color:var(--ink)}
.info-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--mc);color:#fff;margin-bottom:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--mc) 70%,#000)}
.info-ic svg.i{width:34px;height:34px}
.sheet-foot{position:sticky;bottom:0;z-index:2;background:var(--bg);padding:16px 0 18px}
.sheet-pad{height:18px}
.prof{gap:14px;justify-content:flex-start}
.prof-name{flex:1;display:flex;flex-direction:column}
.prof-name small{color:var(--ink3);font-size:13px}
.prof.cur{background:var(--brand-soft)}
.prof svg.i{color:var(--brand)}

/* ---------- welcome ---------- */
.welcome{max-width:520px;margin:0 auto;padding:7vh 0 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.welcome .back{align-self:flex-start;margin-bottom:-10px}
.w-art{margin-bottom:8px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.welcome h1{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.welcome .lead{color:var(--ink2);font-size:17px;max-width:30ch;margin-bottom:12px}
.who-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.who{--mc:var(--brand);display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 14px 22px;border-radius:24px;background:var(--surface);box-shadow:0 5px 0 var(--line2),var(--sh1);transition:transform .08s}
.who:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line2)}
.who-ic{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:var(--mc);color:#fff;margin-bottom:6px;box-shadow:0 4px 0 color-mix(in srgb,var(--mc) 70%,#000)}
.who-ic svg.i{width:38px;height:38px}
.who b{font-family:var(--display);font-size:20px;font-weight:700}
.who span:last-child{font-size:14px;color:var(--ink2)}
.welcome .name-inp{text-align:center;margin-top:6px}

/* ---------- home ---------- */
.hero{position:relative;display:flex;justify-content:space-between;gap:16px;padding:26px 26px 24px;border-radius:28px;background:var(--brand);color:#fff;overflow:hidden;box-shadow:0 6px 0 var(--brand-d),0 20px 40px color-mix(in srgb,var(--brand) 30%,transparent)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.hero-main{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-width:0}
.hello{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.hero-goal{display:flex;align-items:center;gap:14px}
.hero-goal b{display:block;font-family:var(--display);font-size:20px;font-weight:700}
.hero-goal span{font-size:14px;opacity:.8}
.ring{position:relative;width:var(--s);height:var(--s);flex:none}
.ring>svg:not(.i){width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:rgba(255,255,255,.22)}.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring.done .fg{stroke:#7CF0B5}
.ring b,.ring .ring-ic{position:absolute;inset:0;margin:auto;display:grid;place-items:center;font-family:var(--display);font-size:18px;font-weight:700}
.ring .ring-ic{width:28px;height:28px;stroke-width:3}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:99px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
.hchip svg.i{width:18px;height:18px}
.hero-cta{background:#fff;color:var(--brand-d);box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:54px;font-size:16px}
.hero-cta:active{box-shadow:0 1px 0 rgba(0,0,0,.18)}
.hero-art{position:relative;align-self:flex-end;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.weak{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 10px 10px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--sh1);font-size:15px}
.weak-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold-d);flex:none}
.weak-txt{flex:1}
.weak b{font-family:var(--display);font-weight:700}
.sec{margin-top:28px}
.sec h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px 4px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:150px;padding:16px 16px 18px;text-align:left;background:var(--surface);border-radius:24px;box-shadow:0 5px 0 var(--line2),var(--sh1);overflow:hidden;transition:transform .1s,box-shadow .1s}
.mcard:hover{transform:translateY(-2px)}
.mcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line2)}
.mc-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--mc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--mc) 70%,#000);flex:none}
.mc-ic svg.i{width:28px;height:28px}
.mc-ic.sm{width:36px;height:36px;border-radius:12px;box-shadow:none}
.mc-ic.sm svg.i{width:21px;height:21px}
.mcard h3{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin-top:auto}
.mc-meta{display:flex;justify-content:space-between;align-items:baseline;width:100%;font-size:13px;color:var(--ink3);margin-top:-6px}
.mc-meta b{font-family:var(--display);color:var(--ink);font-size:14px}
.new-tag{color:var(--mc);font-weight:700}
.mc-bar{position:absolute;left:16px;right:16px;bottom:10px;height:5px;border-radius:9px;background:var(--sunk);overflow:hidden}
.mc-bar i{display:block;height:100%;background:var(--mc);border-radius:9px}
.badge{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--gold);color:#3A2600;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- practice ---------- */
.practice{max-width:620px;margin:0 auto}
.p-top{display:flex;align-items:center;gap:6px;height:56px}
.p-bar{flex:1;height:14px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:0 6px}
.p-bar span{display:block;height:100%;width:0;border-radius:99px;background:var(--ok);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.3);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--gold-d);font-family:var(--display);font-weight:700;font-size:16px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.streak svg.i{fill:var(--gold);stroke:var(--gold-d);width:22px;height:22px}
@keyframes pop{from{transform:scale(.4)}}
.prompt{text-align:center;min-height:104px;padding:14px 0 16px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.p-mode{--mc:var(--brand);font-size:12.5px;font-weight:700;color:var(--mc);margin-bottom:6px}
.fb-main{font-family:var(--display);font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.fb-sub{color:var(--ink2);font-size:15px;margin-top:6px;min-height:21px}
.prompt[data-kind=wait] .fb-main{color:var(--ink3)}
.prompt[data-kind=bad] .fb-main{color:var(--bad-ink)}

/* xylophone ladder */
.ladder{position:relative;max-width:460px;margin:0 auto;height:calc(var(--span) * var(--u) + var(--u) - 4px)}
.staff{position:absolute;left:8%;right:8%;height:2px;border-radius:2px;background:var(--staff);pointer-events:none}
.rung{--c:#79809A;--t:#fff;position:absolute;height:calc(var(--u) - 5px);display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;background:var(--c);color:var(--t);box-shadow:inset 0 -5px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.28),0 3px 8px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .1s,filter .15s,opacity .2s}
.rung>*{position:relative;z-index:1}
.rung .num{font-family:var(--display);font-size:19px;font-weight:700;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.rung .house{width:20px;height:20px;stroke-width:2.4}
.rung .kbd{margin-left:auto}
.rung .lk{margin-left:auto;width:16px;height:16px;opacity:.85}
.rung.chroma{height:calc(var(--u) - 9px);margin-top:2px;border-radius:11px}
.rung.chroma .num{font-size:15px}
.rung.off{opacity:.22;box-shadow:none;filter:saturate(.6)}
button.rung:not(:disabled):hover{filter:brightness(1.06)}
button.rung:not(:disabled):active,.rung.press{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.rung .mark{position:absolute;right:-12px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:#fff;z-index:3}
.rung .mark svg.i{width:17px;height:17px;stroke-width:3.2}
.rung.good .mark{display:grid;background:var(--ok);box-shadow:0 0 0 3px var(--bg)}
.rung.bad .mark{display:grid;background:var(--bad);box-shadow:0 0 0 3px var(--bg)}
.rung.reveal .mark{display:grid;background:var(--ok);box-shadow:0 0 0 3px var(--bg)}
.rung.good{animation:bounce .45s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 0 4px var(--ok),inset 0 -5px 0 rgba(0,0,0,.16)}
.rung.bad{animation:shake .4s;box-shadow:0 0 0 4px var(--bad),inset 0 -5px 0 rgba(0,0,0,.16)}
.rung.reveal{box-shadow:0 0 0 4px var(--ok),inset 0 -5px 0 rgba(0,0,0,.16);animation:glow 1.2s ease-in-out 2}
.rung.off.reveal,.rung.off.lit{opacity:1;filter:none}
.rung.lit{filter:brightness(1.12);transform:scale(1.03)}
.rung.target{box-shadow:0 0 0 4px var(--ink),inset 0 -5px 0 rgba(0,0,0,.16);opacity:1}
.rung .fill{position:absolute;inset:0;z-index:0;background:rgba(255,255,255,.45);transform-origin:left;transform:scaleX(0);transition:transform .08s linear;border-radius:inherit}
@keyframes bounce{40%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes glow{50%{filter:brightness(1.18)}}
.ball{position:absolute;left:50%;width:34px;height:34px;margin-left:-17px;z-index:4;pointer-events:none;opacity:0;transform:scale(.2);transition:top .3s cubic-bezier(.34,1.4,.64,1),opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.ball svg{display:block;width:100%;height:100%}
.ball.show{opacity:1;transform:scale(1)}
.ball.show.hop{animation:hop .3s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1.1,.85)}45%{transform:translateY(-12px) scale(.92,1.08)}100%{transform:translateY(0) scale(1)}}
.marker{position:absolute;left:-6px;right:-6px;height:3px;border-radius:3px;background:var(--ink);z-index:3;pointer-events:none;transition:top .07s linear}
.marker::before{content:"";position:absolute;left:0;top:-7px;width:17px;height:17px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--bg)}
.marker[data-ok="1"],.marker[data-ok="1"]::before{background:var(--ok)}

.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 18px}
.pill{--c:var(--surface);--t:var(--ink);min-width:48px;height:48px;padding:0 12px;display:grid;place-items:center;border-radius:14px;background:var(--surface);box-shadow:0 3px 0 var(--line2);font-family:var(--display);font-size:18px;font-weight:700;position:relative;transition:transform .15s}
.pill.col{background:var(--c);color:var(--t);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#000)}
.pill.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line2);color:var(--ink3)}
.pill.cur{box-shadow:inset 0 0 0 3px var(--brand);animation:pulse 1.4s ease-in-out infinite}
.pill.given{opacity:.75}
.pill.ok::after,.pill.bad::after{content:"";position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--bg)}
.pill.ok::after{background:var(--ok)}.pill.bad::after{background:var(--bad)}
.pill small{position:absolute;top:calc(100% + 5px);left:0;right:0;font:700 13px/1 var(--sans);color:var(--ok-ink);text-align:center}
.seq.done{margin-bottom:34px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gbtn{--c:var(--brand);position:relative;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:20px;background:var(--c);color:#fff;font-family:var(--display);font-size:17px;font-weight:700;line-height:1.1;text-align:center;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 68%,#000);transition:transform .07s,box-shadow .07s}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 68%,#000)}
.gbtn .kbd{position:absolute;top:9px;right:10px}
.gbtn .gi{width:46px;height:46px;stroke-width:2.2}
.grid.big{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.big .gbtn{min-height:170px;font-size:21px;border-radius:28px}
.gbtn .mark{position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;display:none;place-items:center;color:#fff;box-shadow:0 0 0 3px var(--bg)}
.gbtn .mark svg.i{width:18px;height:18px;stroke-width:3.2}
.gbtn.good{box-shadow:0 0 0 4px var(--ok),0 5px 0 color-mix(in srgb,var(--c) 68%,#000);animation:bounce .45s cubic-bezier(.34,1.56,.64,1)}
.gbtn.bad{box-shadow:0 0 0 4px var(--bad),0 5px 0 color-mix(in srgb,var(--c) 68%,#000);animation:shake .4s;filter:saturate(.6)}
.gbtn.reveal{box-shadow:0 0 0 4px var(--ok),0 5px 0 color-mix(in srgb,var(--c) 68%,#000)}
.gbtn.good .mark,.gbtn.reveal .mark{display:grid;background:var(--ok)}
.gbtn.bad .mark{display:grid;background:var(--bad)}
.g-sep{grid-column:1/-1;height:2px}

/* piano keeps real-instrument colours */
.piano{position:relative;display:flex;height:230px;gap:4px;-webkit-user-select:none;user-select:none;touch-action:manipulation;padding:10px;background:#1B1E2E;border-radius:22px;box-shadow:0 6px 0 #0D0F18,var(--sh2)}
.wk{flex:1;position:relative;border-radius:0 0 12px 12px;background:linear-gradient(#FFFFFF,#F1F2F7);color:#3A4160;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding-bottom:14px;font-size:14px;font-weight:700;box-shadow:inset 0 -6px 0 #D7DAE6;transition:background .1s,transform .06s}
.bk{position:absolute;top:10px;width:9%;height:58%;background:linear-gradient(#3A3F55,#22263A);color:#D9DCE8;border-radius:0 0 9px 9px;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;padding-bottom:10px;font-size:11px;font-weight:700;box-shadow:inset 0 -5px 0 #12141F,0 3px 4px rgba(0,0,0,.4)}
.wk .kbd{color:#3A4160}.bk .kbd{color:#D9DCE8}
.wk.press,.wk:active{background:#E2E5F0;box-shadow:inset 0 -2px 0 #D7DAE6}
.bk.press,.bk:active{background:#4A5068}
.wk.good{background:#C3F2D9}.bk.good{background:var(--ok)}
.wk.bad{background:#FBC7CA}.bk.bad{background:var(--bad)}
.wk.reveal{background:#C3F2D9;box-shadow:inset 0 0 0 3px var(--ok)}.bk.reveal{background:var(--ok)}

/* dock: tools while answering, result banner after */
.dock{max-width:620px;margin:20px auto 0}
.dock.tools{display:flex;justify-content:center;gap:10px;min-height:76px}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tool-ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line2);transition:transform .06s,box-shadow .06s}
.tool:active .tool-ic{transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
.tool:disabled{opacity:.4}
.dock.result{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 18px;border-radius:24px;animation:rise .3s cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.dock.result.ok{background:var(--ok-soft)}
.dock.result.bad{background:var(--bad-soft)}
.res{display:flex;align-items:center;gap:12px;min-width:0}
.res-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.res-ic svg.i{width:26px;height:26px;stroke-width:3.2}
.ok .res-ic{background:var(--ok)}.bad .res-ic{background:var(--bad)}
.res-main{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.ok .res-main{color:var(--ok-ink)}.bad .res-main{color:var(--bad-ink)}
.res-sub{font-size:14px;color:var(--ink2);margin-top:1px}
.res-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.dock.result.ok .btn.go{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.dock.result.bad .btn.go{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.go .kbd{color:#fff}
.dock.intro{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line2);transition:background .2s,width .2s}
.dots i.on{background:var(--brand);width:24px;border-radius:9px}

/* ---------- summary ---------- */
.summary{max-width:500px;margin:0 auto;text-align:center;padding-top:30px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:6px}
.star svg.i{width:62px;height:62px;fill:var(--sunk);stroke:var(--line2);stroke-width:1.5}
.star:nth-child(2) svg.i{width:80px;height:80px}
.star.on svg.i{fill:var(--gold);stroke:var(--gold-d);animation:starpop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d)}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.sum-score{font-family:var(--display);font-size:64px;font-weight:800;line-height:1;letter-spacing:-.04em}
.sum-title{font-family:var(--display);font-size:22px;font-weight:700;margin-top:8px;color:var(--ink2)}
.sum-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 0 18px}
.sum-stats div{padding:14px 6px;border-radius:20px;background:var(--surface);box-shadow:var(--sh1)}
.sum-stats b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.sum-stats span{font-size:12.5px;color:var(--ink3)}
.new{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:10px 16px;border-radius:99px;background:var(--gold);color:#3A2600;font-size:15px;font-weight:700;animation:pop .4s cubic-bezier(.34,1.56,.64,1) .6s both}
.new svg.i{width:18px;height:18px}
.summary .cells{justify-content:center}
.sum-actions{display:flex;flex-direction:column;gap:10px;margin-top:28px}

/* ---------- progress ---------- */
.page-title{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:6px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{--kc:var(--brand);display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--sh1)}
.kpi-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc) 16%,transparent);color:var(--kc);flex:none}
.kpi b{display:block;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink3)}
.card{background:var(--surface);border-radius:22px;padding:18px;margin-top:14px;box-shadow:var(--sh1)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head h3{font-family:var(--display);font-size:16px;font-weight:700;flex:1}
.card-meta{font-family:var(--display);font-weight:700;font-size:16px}
.chart svg{display:block;width:100%;height:auto}
.chart .bar.hi{fill:var(--ok)}.chart .bar.mid{fill:var(--gold)}.chart .bar.lo{fill:var(--bad)}.chart .bar.none{fill:var(--line2)}
.chart .zero{fill:var(--sunk)}
.chart text{fill:var(--ink3);font:600 11px var(--sans)}
.chart .goal{stroke:var(--ink3);stroke-dasharray:4 5;stroke-width:1.5}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{min-width:48px;padding:6px 8px;border-radius:12px;text-align:center;background:var(--sunk)}
.cell b{display:block;font-family:var(--display);font-size:14px;font-weight:700}
.cell small{display:block;font-size:11px;font-weight:600;color:var(--ink3)}
.cell[data-l=hi]{background:var(--ok-soft)}.cell[data-l=hi] small{color:var(--ok-ink)}
.cell[data-l=mid]{background:color-mix(in srgb,var(--gold) 18%,transparent)}.cell[data-l=mid] small{color:var(--gold-d)}
.cell[data-l=lo]{background:var(--bad-soft)}.cell[data-l=lo] small{color:var(--bad-ink)}
.conf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.conf-row b{color:var(--ink);font-family:var(--display)}
.empty{color:var(--ink3);font-size:15px;text-align:center;padding:30px 10px}

/* ---------- settings ---------- */
.settings{max-width:620px}
.set-h{font-family:var(--display);font-size:15px;font-weight:700;color:var(--ink2);margin:24px 0 10px 4px}
.status{font-size:13px;color:var(--ink3);margin:8px 4px 0}

/* ---------- phones ---------- */
@media (max-width:680px){
  :root{--u:32px}
  .app{padding-left:14px;padding-right:14px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .top{height:54px;margin-bottom:6px}
  .tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh2)}
  .tabs button{flex:1;flex-direction:column;gap:2px;padding:7px 4px;font-size:11px;border-radius:16px}
  body[data-view=practice] .tabs,body[data-view=summary] .tabs,body[data-view=welcome] .tabs{display:none}
  body[data-view=practice] .app{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .hero{padding:20px 18px;border-radius:26px}
  .hero-art{position:absolute;right:-26px;top:16px;opacity:.9;transform:scale(.72);transform-origin:top right}
  .hello{font-size:25px;max-width:80%}
  .hero-cta{width:100%}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .mcard{min-height:142px;padding:14px 14px 18px}
  .mcard h3{font-size:15px}
  .prompt{min-height:78px;padding:2px 0 10px}
  .p-mode{margin-bottom:3px}
  .fb-main{font-size:22px}
  .fb-sub{font-size:14px;margin-top:3px;min-height:19px}
  .p-top{height:50px}
  .rung .num{font-size:17px}
  .rung .house{width:18px;height:18px}
  .ball{width:28px;height:28px;margin-left:-14px}
  .dock.tools{min-height:0;gap:6px}
  .tool-ic{width:48px;height:48px;border-radius:16px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;border-radius:26px 26px 0 0!important;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))!important;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -8px 30px rgba(20,24,51,.1)}
  .dock.result.ok{background:var(--ok-soft)}.dock.result.bad{background:var(--bad-soft)}
  .dock.result{flex-wrap:nowrap;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))!important}
  .res{flex:1;gap:9px}
  .res-ic{width:36px;height:36px}.res-ic svg.i{width:21px;height:21px}
  .res-txt{min-width:0}
  .res-main{font-size:17px;line-height:1.15}
  .res-sub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res-actions{gap:6px}
  .dock.result .icon-btn.round{width:44px;height:44px}
  .cmp{width:44px;padding:0!important}.cmp .lbl{display:none}
  .dock.result .btn.go{min-height:48px;padding:0 16px;border-radius:14px}
  .grid.big .gbtn{min-height:150px}
  .piano{height:200px;padding:8px;gap:3px;border-radius:18px}
  .wk{font-size:12px;padding-bottom:11px}.bk{font-size:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-title{font-size:26px}
  .sheet-wrap{align-items:flex-end;padding:0}
  .sheet{max-height:90vh;border-radius:28px 28px 0 0}
  .grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--line2);margin:10px auto 0}
  .sheet-head{padding-top:8px}
  .sheet-foot{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .sum-score{font-size:56px}
  .welcome{padding-top:5vh}
  .welcome h1{font-size:32px}
}
@media (max-width:680px) and (max-height:620px){
  :root{--u:26px}
  .rung .num{font-size:15px}
  .rung .house{width:15px;height:15px}
  .ball{width:22px;height:22px;margin-left:-11px}
  .prompt{min-height:62px}
  .fb-main{font-size:19px}
  .fb-sub{display:none}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- v3.1 additions ---------- */
/* result banner buttons: outlined in the banner colour so they stay visible in both themes */
.dock.result .btn.ghost,.dock.result .icon-btn.round{background:var(--surface);color:var(--ink)}
.dock.result .btn.ghost:active,.dock.result .icon-btn.round:active{transform:translateY(2px)}
/* tours */
.tour-tag{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:5px 10px;border-radius:99px;margin-right:4px}
.answer.demo .gbtn{cursor:default}
.demo-hi{animation:demohi .9s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 0 5px var(--brand),0 8px 24px color-mix(in srgb,var(--brand) 35%,transparent)!important;z-index:2}
.wk.demo-hi{background:#DDE3FF}.bk.demo-hi{background:var(--brand)}
@keyframes demohi{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
/* degree reference in the info sheet */
.deg-list{margin-top:16px}
.deg-list h3{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:10px}
.deg-row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.deg-row:first-of-type{border-top:0}
.deg-n{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--t);font-family:var(--display);font-weight:700;font-size:13px}
.deg-row p{font-size:14.5px;line-height:1.45;color:var(--ink2)}
.deg-row b{color:var(--ink)}
.foot-col{display:flex;flex-direction:column;gap:10px}
/* account */
.acc-off,.acc-on{flex-wrap:nowrap;gap:14px}
.acc-ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.acc-photo{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover}
.acc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-txt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-txt small{font-size:13px;color:var(--ink3)}
.acc-txt small.err{color:var(--bad-ink)}
.acc-hint{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px;border-radius:20px;background:var(--brand-soft);color:var(--brand);text-align:left}
.acc-hint span{display:flex;flex-direction:column;color:var(--ink)}
.acc-hint small{color:var(--ink2);font-size:13px}
.have-acc{font-size:14.5px;color:var(--ink2);margin-top:6px}
.chev{width:18px;height:18px;color:var(--ink3)}
.fb-entry{margin-top:14px}
/* auth sheet */
.auth{display:flex;flex-direction:column;gap:12px}
.auth-seg{align-self:center;margin-bottom:2px}
.auth-lead{font-size:15px!important;text-align:center}
.g-btn{gap:12px;font-weight:700}
.g-btn svg{flex:none}
.or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13px;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.auth-form{display:flex;flex-direction:column;gap:10px}
.auth-form .name-inp{flex:none;width:100%}
.auth .link{align-self:center}
.auth-msg{font-size:14px;min-height:20px;text-align:center;color:var(--ink2)}
.auth-msg.err{color:var(--bad-ink)}
.auth-msg.ok{color:var(--ok-ink)}
.btn.busy{opacity:.6;pointer-events:none}
/* feedback */
.rate{display:flex;justify-content:center;gap:6px}
.rate button{padding:4px}
.rate svg.i{width:38px;height:38px;fill:var(--sunk);stroke:var(--line2);stroke-width:1.5;transition:transform .15s}
.rate button.on svg.i{fill:var(--gold);stroke:var(--gold-d)}
.rate button:active svg.i{transform:scale(.85)}
.fb-text{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line2);background:var(--surface);font:inherit;font-size:16px;resize:vertical;min-height:120px;outline:none}
.fb-text:focus{border-color:var(--brand)}

/* ---------- v3.2 ---------- */
.icon-btn.round{background:var(--btn-bg);box-shadow:inset 0 0 0 1.5px var(--btn-line),0 3px 0 var(--btn-line)}
.tool-ic{background:var(--btn-bg);box-shadow:inset 0 0 0 1.5px var(--btn-line),0 4px 0 var(--btn-line)}
.tool:active .tool-ic{box-shadow:inset 0 0 0 1.5px var(--btn-line),0 1px 0 var(--btn-line)}
.g-btn{background:#fff;color:#1F1F1F;box-shadow:inset 0 0 0 1.5px #DADCE0,0 3px 0 #DADCE0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g-btn{background:#131314;color:#E3E3E3;box-shadow:inset 0 0 0 1.5px #8E918F,0 3px 0 #5F6368}}
:root[data-theme="dark"] .g-btn{background:#131314;color:#E3E3E3;box-shadow:inset 0 0 0 1.5px #8E918F,0 3px 0 #5F6368}
.acc-actions{justify-content:flex-start;gap:10px}
.pass-wrap{position:relative}
.pass-wrap .name-inp{padding-right:52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink3)}
.eye.on{color:var(--brand)}
.mail-ic{width:72px;height:72px;border-radius:24px;margin:4px auto 2px;display:grid;place-items:center;background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d)}
.mail-ic svg.i{width:38px;height:38px}
.auth-note{font-size:13.5px;color:var(--ink3);text-align:center;margin-top:-4px}
.auth .btn{width:100%}

/* ---------- note reading ---------- */
.reading{display:flex;flex-direction:column;gap:18px;max-width:560px;margin:0 auto}
.staff-box{background:var(--surface);border-radius:24px;box-shadow:var(--sh1);padding:10px 8px;color:var(--ink)}
.staff-svg{display:block;width:100%;height:auto}
.staff-svg .sl{stroke:currentColor;stroke-width:1.3;opacity:.85}
.staff-svg .ledger{stroke:currentColor;stroke-width:1.6}
.staff-svg .head{fill:currentColor}
.staff-svg .hole{fill:var(--surface)}
.staff-svg .nt{animation:noteIn .35s cubic-bezier(.2,.9,.25,1)}
.staff-svg .nt.ok{color:var(--ok)}
.staff-svg .nt.bad{color:var(--bad)}
.staff-svg .nt.ok .ledger,.staff-svg .nt.bad .ledger{stroke:var(--ink)}
.staff-svg .nlabel{font:700 15px var(--display);fill:currentColor}
@keyframes noteIn{from{opacity:0;transform:translateX(40px)}}
.note-keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.nkey{--c:var(--brand);position:relative;height:64px;border-radius:16px;background:var(--c);color:var(--t,#fff);font-family:var(--display);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 68%,#000);transition:transform .06s,box-shadow .06s}
.nkey:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 68%,#000)}
.nkey .kbd{font-size:10px;padding:2px 4px}
.nkey .mark{position:absolute;top:-9px;right:-7px;width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:#fff;box-shadow:0 0 0 3px var(--bg)}
.nkey .mark svg.i{width:15px;height:15px;stroke-width:3.2}
.nkey.good{box-shadow:0 0 0 4px var(--ok),0 4px 0 color-mix(in srgb,var(--c) 68%,#000);animation:bounce .45s cubic-bezier(.34,1.56,.64,1)}
.nkey.bad{box-shadow:0 0 0 4px var(--bad),0 4px 0 color-mix(in srgb,var(--c) 68%,#000);animation:shake .4s}
.nkey.reveal{box-shadow:0 0 0 4px var(--ok),0 4px 0 color-mix(in srgb,var(--c) 68%,#000)}
.nkey.good .mark,.nkey.reveal .mark{display:grid;background:var(--ok)}
.nkey.bad .mark{display:grid;background:var(--bad)}
@media (max-width:680px){
  .note-keys{gap:5px}
  .nkey{height:58px;font-size:12.5px;border-radius:13px}
  .staff-box{border-radius:20px;padding:6px 4px}
}

.acc-off .acc-txt b{white-space:normal}

.staff-svg .clef{fill:currentColor}

/* ---------- feedback card on home ---------- */
.fb-card{display:flex;align-items:center;gap:16px;margin-top:30px;padding:18px 20px;border-radius:24px;background:var(--surface);box-shadow:var(--sh1);position:relative;overflow:hidden}
.fb-card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 0% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 60%);pointer-events:none}
.fb-card>*{position:relative}
.fb-ic{width:52px;height:52px;flex:none;border-radius:17px;display:grid;place-items:center;background:var(--gold);color:#3A2600;box-shadow:0 4px 0 var(--gold-d)}
.fb-ic svg.i{width:28px;height:28px}
.fb-card.thanks .fb-ic{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.fb-body{flex:1;min-width:0}
.fb-body h3{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.fb-body p{font-size:14px;color:var(--ink2);margin:3px 0 0}
.rate.inline{justify-content:flex-start;gap:2px;margin:8px 0 0 -4px}
.rate.inline svg.i{width:32px;height:32px}
.rate.inline button:hover svg.i{transform:scale(1.12)}
@media (max-width:680px){
  .fb-card{flex-wrap:wrap;padding:16px}
  .fb-card .fb-write{width:100%}
  .rate.inline svg.i{width:36px;height:36px}
}
.auth .name-inp{flex:none;width:100%}

/* ---------- merged profile card ---------- */
.prof-head{flex-wrap:nowrap;align-items:flex-start;gap:14px;padding-top:16px;padding-bottom:14px}
.acc-photo.big{border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--line)}
.prof-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.name-line{display:flex;gap:8px;align-items:center}
.name-line .name-inp{flex:1;min-width:0}
.name-line .btn{flex:none}
.acc-status{font-size:13.5px;color:var(--ink3);line-height:1.4;display:flex;flex-direction:column;gap:1px;padding-left:4px}
.acc-status b{color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-status .err{color:var(--bad-ink)}
.acc-actions{flex-wrap:wrap}
.sheet:focus,.sheet:focus-visible{outline:none}

.code-inp{text-align:center;font-family:var(--display);font-size:26px!important;letter-spacing:.35em;height:62px!important}

/* ---------- v3.4: avatars — always a perfect circle, art centred ---------- */
.avatar{flex:none;display:block;width:40px;height:40px;aspect-ratio:1;border-radius:50%;overflow:hidden;padding:0;background:var(--sunk)}
.avatar svg,.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.avatar.big{width:56px;height:56px}
#avatar.avatar{width:42px;height:42px;box-shadow:0 0 0 2px var(--surface),0 3px 10px rgba(20,24,51,.18);transition:transform .15s}
#avatar.avatar:hover{transform:scale(1.06)}
.av-edit{position:relative;flex:none;width:60px;height:60px;border-radius:50%;margin-top:2px}
.av-edit .avatar.big{width:60px;height:60px;box-shadow:0 3px 10px rgba(20,24,51,.14)}
.av-pen{position:absolute;right:-3px;bottom:-1px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;box-shadow:0 0 0 3px var(--surface)}
.av-pen svg.i{width:13px;height:13px;stroke-width:2.4}
.hello-row{display:flex;align-items:center;gap:12px}
.hero-av{flex:none;width:52px;height:52px;border-radius:50%}
.hero-av .avatar{width:52px;height:52px;box-shadow:0 0 0 3px rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.18);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.hero-av:hover .avatar{transform:rotate(-8deg) scale(1.06)}
.w-avatar{width:110px;height:110px;border-radius:50%;overflow:hidden;box-shadow:0 10px 30px rgba(20,24,51,.14);animation:bob 3s ease-in-out infinite}
.w-avatar svg{display:block;width:100%;height:100%}
/* picker in the sheet */
.av-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px;padding:4px 0 6px}
.av-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--ink2);background:none}
.av-opt .avatar{position:relative;width:64px;height:64px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .15s}
.av-opt:hover .avatar{transform:scale(1.06)}
.av-opt:active .avatar{transform:scale(.95)}
.av-opt.on{color:var(--ink)}
.av-opt.on .avatar{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--brand)}
.av-opt>span:last-child{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:681px){.av-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
/* row on the welcome screen */
.av-row{display:grid;grid-template-columns:repeat(6,minmax(0,52px));justify-content:center;gap:12px 14px;width:100%;margin:2px 0 6px}
.av-mini{width:100%;aspect-ratio:1;padding:0;border-radius:50%;background:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.av-mini .avatar{width:100%;height:100%;transition:box-shadow .15s}
.av-mini:hover{transform:scale(1.07)}
.av-mini:active{transform:scale(.94)}
.av-mini.on{transform:scale(1.1)}
.av-mini.on .avatar{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--brand)}
@media (max-width:400px){.av-row{gap:10px 10px;grid-template-columns:repeat(6,minmax(0,46px))}}

/* ---------- v3.4: red (danger) buttons — soft fill with a red 3D edge, no outline ---------- */
:root{--bad-edge:color-mix(in srgb,var(--bad) 45%,var(--surface));--ok-edge:color-mix(in srgb,var(--ok) 45%,var(--surface))}
.btn.danger,.btn.small.danger{background:var(--bad-soft);color:var(--bad-ink);box-shadow:0 3px 0 var(--bad-edge)}
.btn.danger:hover{filter:saturate(1.15)}
.btn.danger:active,.btn.small.danger:active{transform:translateY(3px);box-shadow:0 0 0 var(--bad-edge)}
.btn.danger:focus-visible{outline-color:var(--bad)}
.dock.result.bad .btn.ghost,.dock.result.bad .icon-btn.round{background:var(--surface);color:var(--bad-ink);box-shadow:0 3px 0 var(--bad-edge)}
.dock.result.ok .btn.ghost,.dock.result.ok .icon-btn.round{background:var(--surface);color:var(--ok-ink);box-shadow:0 3px 0 var(--ok-edge)}
.dock.result .btn.ghost:active,.dock.result .icon-btn.round:active{transform:translateY(3px);box-shadow:0 0 0 transparent}

/* ---------- v3.4: sheets — no layout jump, smooth close, swipe down on phones ---------- */
body.locked{overflow:hidden;padding-right:var(--sbw,0px)}
.sheet-wrap.closing{animation:fadeOut .22s ease forwards;pointer-events:none}
.sheet-wrap.closing .sheet{animation:sheetOut .22s cubic-bezier(.4,0,1,1) forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetOut{to{transform:translateY(24px) scale(.98);opacity:0}}
.sheet.dragging{transition:none!important;animation:none}
@media (max-width:680px){
  @keyframes sheetOut{to{transform:translateY(105%)}}
  .sheet{animation:sheetIn .3s cubic-bezier(.2,.9,.25,1)}
  @keyframes sheetIn{from{transform:translateY(100%)}}
  .grab,.sheet-head{touch-action:none}
  .grab{padding:0;margin:10px auto 0}
}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 28 24" aria-hidden="true"><rect x="0" y="18" width="14" height="5" rx="2.5" fill="#F0505A"/><rect x="4.5" y="12" width="13" height="5" rx="2.5" fill="#FFC93C"/><rect x="9" y="6" width="12" height="5" rx="2.5" fill="#1FB873"/><rect x="13.5" y="0" width="11" height="5" rx="2.5" fill="#1E9BE0"/></svg>
      <span>Solfeggio<b>Online</b></span>
    </div>
    <nav class="tabs" aria-label="Разделы">
      <button type="button" data-nav="home" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Тренировка</span></button>
      <button type="button" data-nav="progress"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg><span>Прогресс</span></button>
      <button type="button" data-nav="settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Настройки</span></button>
    </nav>
    <button type="button" id="avatar" class="avatar" aria-label="Профиль" hidden></button>

  <main>

  </main>
</div>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
// replaceChildren(null) would print the word "null"; empty slots are dropped instead.
const _rc = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { return _rc.apply(this, kids.flat().filter(k => k != null && k !== false)); };
const _ap = Element.prototype.append;
Element.prototype.append = function (...kids) { return _ap.apply(this, kids.flat().filter(k => k != null && k !== false)); };
const mod = (n, m) => ((n % m) + m) % m;
const nd = d => mod(d + 6, 12) - 6;               // nearest signed distance in semitones
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const sleep = ms => new Promise(r => setTimeout(r, Math.max(0, ms)));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pct = (c, a) => (a ? Math.round((c / a) * 100) : 0);
const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
function dayKey(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
const fmtSec = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' с';
const lvl = acc => (acc == null ? 'none' : acc >= 0.85 ? 'hi' : acc >= 0.6 ? 'mid' : 'lo');

/* =========================================================
   Storage: device settings + profiles (each profile has its own stats)
   ========================================================= */
const STORE = 'notes.v3';
const DEFAULT_SETTINGS = { names: 'latin', tempo: 'mid', goal: 50, autoAdvance: true, adaptive: true };
const DEFAULT_DEV = { theme: 'auto', timbre: 'piano', volume: 0.8 };
const PROFILE_COLORS = ['#3B4FE0', '#F0505A', '#19B46F', '#FF8C2A', '#7C6CFF', '#D9479F'];
const ROOT = loadRoot();
const DEV = ROOT.dev;
let DB = ROOT.profile || null;      // the one and only profile on this device
const KID = () => !!DB && DB.kind === 'kid';

function fixProfile(p) {
  p.settings = Object.assign({}, DEFAULT_SETTINGS, p.settings);
  p.cfg = p.cfg || {}; p.stats = p.stats || {}; p.days = p.days || {}; p.seen = p.seen || {};
  if (!p.color) p.color = PROFILE_COLORS[0];
  return p;
}
function readOldStats() {
  try {
    const old = JSON.parse(localStorage.getItem('notesNoteStats') || 'null');
    if (!old) return null;
    const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const st = { s: {}, conf: {} };
    names.forEach((n, i) => { const x = old[n]; if (x && x.a) st.s[i] = { a: x.a | 0, c: x.c | 0, r: '', t: 0 }; });
    return Object.keys(st.s).length ? st : null;
  } catch (e) { return null; }
}
function loadRoot() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { raw = null; }
  if (raw && raw.v === 4) {
    raw.dev = Object.assign({}, DEFAULT_DEV, raw.dev);
    if (raw.profile) fixProfile(raw.profile);
    return raw;
  }
  if (raw && raw.profiles) {   // v3 kept several profiles; one account = one profile now, extras are archived
    const ids = Object.keys(raw.profiles);
    const cur = raw.profiles[raw.current] || raw.profiles[ids[0]] || null;
    const root = { v: 4, dev: Object.assign({}, DEFAULT_DEV, raw.dev), profile: cur ? fixProfile(cur) : null };
    const rest = ids.map(id => raw.profiles[id]).filter(p => !cur || p.id !== cur.id);
    if (rest.length) root.archive = rest;
    return root;
  }
  const root = { v: 4, dev: Object.assign({}, DEFAULT_DEV), profile: null };
  let v2 = null;
  try { v2 = JSON.parse(localStorage.getItem('notes.v2') || 'null'); } catch (e) { v2 = null; }
  if (v2) {
    const st = v2.settings || {};
    ['theme', 'timbre', 'volume'].forEach(k => { if (k in st) root.dev[k] = st[k]; });
    root.profile = fixProfile({ id: 'p1', name: 'Я', kind: 'adult', settings: st, cfg: v2.cfg, stats: v2.stats, days: v2.days, last: v2.last || null, seen: v2.seen });
  } else {
    const old = readOldStats();
    if (old) root.oldStats = old;
  }
  return root;
}
function createProfile(name, kind, avatar) {
  const id = 'p' + Date.now().toString(36) + rand(1000);
  const p = fixProfile({ id, name: (name || '').trim() || (kind === 'kid' ? 'Малыш' : 'Я'), kind, color: PROFILE_COLORS[rand(PROFILE_COLORS.length)],
    settings: kind === 'kid' ? { goal: 20, names: 'solfege' } : { goal: 50 } });
  if (kind === 'adult' && ROOT.oldStats) { p.stats.absolute = ROOT.oldStats; p.migrated = true; delete ROOT.oldStats; }
  if (typeof Cloud !== 'undefined' && Cloud.user) p.owner = Cloud.user.id;

defMode({
  id: 'degrees', title: 'Ступени', unit: 'ступень', keyCtx: true, color: '#F0505A', ball: true,
  kid: { title: 'Лесенка', about: 'Сначала пианино показывает, где дом. Потом нота прыгает на одну из ступенек. Угадай, на какую!', tip: 'Пропой ноту и спускайся по ступенькам домой — сколько шагов, такая и ступенька.', prompt: 'На какую ступеньку?' },
  kidStart: 2,
  about: 'Звучит каденция, затем одна нота. Определи её ступень в тональности.',
  tip: 'Пропой ноту и мысленно спустись по ступеням к тонике: число шагов и есть ответ.',
  defaults: { scale: 'major', keyMode: 'each', key: 0, cadence: 'each', range: 1, resolve: true, auto: true, count: null },
  variant: c => c.scale, fromVariant: v => ({ scale: v }), variantName: v => (v === 'minor' ? 'минор' : 'мажор'),
  levels: c => DEG_LEVELS[c.scale], startCount: 3, kind: 'num',
  allItems: () => [...Array(12).keys()], chipGroups: degreeGroups,
  itemLabel: (it, c) => degLabel(it, c.scale), itemSub: (it, c) => degSub(it, c.scale),
  answer: 'ladder', rows: (c, sel) => degreeRows(c, sel),
  settings(c, set) {
    return [...keyFields(c, set),
      field('Диапазон', seg([[1, '1 окт.'], [2, '2 окт.'], [3, '3 окт.']], c.range, v => set('range', v))),
      switchRow('Разрешение в тонику', c.resolve, v => set('resolve', v, true))];
  },
  newQ(s, c, sel) {
    const key = nextKey(s, c);
    const off = pickItem(s, sel);
    const k = c.range === 1 ? 0 : c.range === 2 ? pick([-1, 0]) : pick([-1, 0, 1]);
    let m = key.t + off + 12 * k;
    while (m < 40) m += 12;
    while (m > 84) m -= 12;
    return { key, ctx: key.changed || c.cadence === 'each', targets: [off], midi: [m] };
  },
  playQ(q, c, how) {
    const T = tempo(), ev = [];
    let at = 0;
    if (wantsContext(q, how)) { ev.push(...cadenceEvents(q.key.t, c.scale)); at = cadenceLen() + T.gap; }
    ev.push({ m: q.midi[0], at, dur: 1.4, vel: 0.85 });
    return AudioEngine.play(ev, { resolveAt: at + 0.2 });
  },
  after(q, c, ok) {
    const off = q.targets[0], g = q.given[0], base = q.midi[0] - off, tp = tempo();
    const gm = q.midi[0] + nd(g - off);
    const gpos = g === 0 && gm - base >= 12 ? 12 : mod(g, 12);
    const ev = [{ m: gm, at: 0.05, dur: 0.75, vel: 0.85, mark: () => { lightRow(gpos); ballTo(gpos); } }];
    let at = 0.9;
    if (!ok) { ev.push({ m: q.midi[0], at, dur: 0.85, vel: 0.85, mark: () => { lightRow(off); ballTo(off); } }); at += 1.0; }
    if (c.resolve) {
      const path = resolutionPath(off, c.scale).slice(1);
      path.forEach((p, i) => ev.push({ m: base + p, at: at + i * tp.res, dur: i === path.length - 1 ? 1.1 : tp.res * 0.95, vel: 0.75, mark: () => { lightRow(p); ballTo(p); } }));
      at += Math.max(0, path.length - 1) * tp.res + (path.length ? 0.55 : 0);
    }
    return AudioEngine.play(ev, { resolveAt: at }).then(r => { lightRow(null); return r; });
  },
  compare(q) {
    const g = q.given[0], t = q.targets[0];
    return AudioEngine.play([{ m: q.midi[0] + nd(g - t), at: 0, dur: 0.85, vel: 0.8 }, { m: q.midi[0], at: 1.0, dur: 1.2, vel: 0.85 }]);
  },
  prompt: () => 'Какая ступень?',
  feedback(q, c, ok) {
    const t = q.targets[0];
    return [ok ? 'Верно' : `Это ${degLabel(t, c.scale)}`, degSub(t, c.scale)];
  },
  tourCfg: { scale: 'major' },
  tour: (kid, X) => [
    { main: 'Это дом', sub: kid ? 'Сначала пианино показывает, где дом.' : 'Аккорды задают тональность. Её первая ступень, тоника, — это «дом».',
      run: () => { X.light(0); X.ball(0); return X.play([...cadenceEvents(X.t, 'major'), { m: X.t, at: cadenceLen() + 0.25, dur: 1.2, vel: 0.85 }]); } },
    { main: 'Нота прыгает на ступеньку', sub: kid ? 'Вот ступенька 5. Слышишь, как она бежит домой?' : 'Это 5-я ступень, доминанта. После ответа нота всегда возвращается к тонике.',
      run: () => { X.light(null); X.ball(0); const path = resolutionPath(7, 'major');
        return X.play([{ m: X.t, at: 0, dur: 0.8 }, { m: X.t + 7, at: 1.0, dur: 1.2, mark: () => { X.ball(7); X.light(7); } },
          ...path.slice(1).map((p, i) => ({ m: X.t + p, at: 2.3 + i * 0.42, dur: i === path.length - 2 ? 1.2 : 0.4, mark: () => { X.ball(p); X.light(p); } }))]); } },
    { main: 'Теперь ты', sub: kid ? 'Послушай дом, потом ноту и нажми на её ступеньку. Сначала только дом и 5.' : 'Определи ступень и нажми на неё — услышишь свой ответ и путь домой. Начнём с 1, 3 и 5.',
      run: () => { X.light(null); X.ball(0); } },
  ],
});

defMode({

  settings(c, set) {

    if (c.len > 1) f.push(switchRow('Начинать с тоники', c.startTonic, v => set('startTonic', v, true)));
    return f;
  },
  newQ(s, c, sel) {
    const key = nextKey(s, c);
    const targets = [];
    let pre = 0;
    if (c.startTonic && c.len > 1) { targets.push(0); pre = 1; s.last = 0; }
    while (targets.length < c.len) targets.push(pickItem(s, sel));
    return { key, ctx: key.changed || c.cadence === 'each', targets, pre };
  },
  chordNotes(q, c, r) { return voicing(q.key.t, r, CHORDS[dia(c.scale, r)[1]].iv); },
  playQ(q, c, how) {
    const T = tempo(), ev = [];
    let at = 0;
    if (wantsContext(q, how)) { ev.push(...cadenceEvents(q.key.t, c.scale)); at = cadenceLen() + T.gap + 0.1; }
    q.targets.forEach((r, i) => ev.push({ m: this.chordNotes(q, c, r), at: at + i * T.chord * 1.3, dur: T.chord * (i === q.targets.length - 1 ? 1.7 : 1.2), vel: 0.6 }));
    return AudioEngine.play(ev, { resolveAt: at + 0.15 });
  },
  tapSound(it, q, pos, c) { if (q.targets.length > 1) AudioEngine.play([{ m: this.chordNotes(q, c, it), at: 0, dur: 0.8, vel: 0.5 }]); },
  after(q, c, ok) {
    if (q.targets.length !== 1) return null;
    const ev = [{ m: this.chordNotes(q, c, q.given[0]), at: 0.05, dur: 1.0, vel: 0.6 }];
    if (!ok) ev.push({ m: this.chordNotes(q, c, q.targets[0]), at: 1.3, dur: 1.3, vel: 0.65 });
    return AudioEngine.play(ev);
  },
  compare(q, c) {
    const T = tempo(), step = T.chord * 1.3, ev = [];
    q.given.forEach((g, i) => ev.push({ m: this.chordNotes(q, c, g), at: i * step, dur: T.chord * 1.2, vel: 0.55 }));
    const off = q.targets.length * step + 0.8;
    q.targets.forEach((r, i) => ev.push({ m: this.chordNotes(q, c, r), at: off + i * step, dur: T.chord * 1.2, vel: 0.6 }));
    return AudioEngine.play(ev);
  },
  prompt: q => (q.targets.length > 1 ? 'Какие аккорды?' : 'Какой аккорд?'),

      { main: 'Теперь ты', sub: 'После каденции прозвучит аккорд. Найди его ступень — услышишь свой ответ и правильный.', run: () => X.light(null) },
    ];
  },
  feedback(q, c, ok) {
    if (q.targets.length === 1) { const d = dia(c.scale, q.targets[0]); return [ok ? 'Верно' : `Это ${d[2]}`, FUNC_NAME[d[3]]]; }
    const errs = q.results.filter(r => r === false).length;

  },
});

    if (c.inv) { inv = rand(iv.length); for (let j = 0; j < inv; j++) notes[j] += 12; notes.sort((a, b) => a - b); }
    return { targets: [it], root, inv, midi: notes };
  },
  chordEvents(n, how, at = 0) {
    const step = 0.34, ev = [];
    if (how !== 'block') n.forEach((m, i) => ev.push({ m, at: at + i * step, dur: (n.length - 1 - i) * step + 1.2, vel: 0.72 }));
    if (how !== 'arp') ev.push({ m: n, at: at + (how === 'both' ? n.length * step + 0.35 : 0), dur: 1.9, vel: 0.65, strum: 0.012 });
    return ev;
  },
  playQ(q, c) { return AudioEngine.play(this.chordEvents(q.midi, c.arp), { resolveAt: 0.2 }); },
  after(q, c, ok) { if (ok) return null; return sleep(250).then(() => (P.q === q ? this.compare(q) : null)); },
  compare(q) {
    const g = CHORDS[q.given[0]].iv.map(i => q.root + i);
    return AudioEngine.play([{ m: g, at: 0, dur: 1.6, vel: 0.65, strum: 0.012 }, { m: q.midi, at: 2.0, dur: 1.9, vel: 0.65, strum: 0.012 }]);

const MODE_LISTS = {
  adult: [['В тональности', ['degrees', 'dictation', 'harmony']], ['Без тональности', ['intervals', 'chords', 'absolute']], ['Ноты и голос', ['reading', 'sing']]],
  kid: [['Разминка', ['updown', 'mood']], ['Лесенка', ['degrees', 'dictation']], ['Ноты и голос', ['reading', 'sing']]],
};
const modeList = () => MODE_LISTS[KID() ? 'kid' : 'adult'];
const UNIT_FORMS = { 'ступень': ['ступень', 'ступени', 'ступеней'], 'интервал': ['интервал', 'интервала', 'интервалов'], 'аккорд': ['аккорд', 'аккорда', 'аккордов'], 'нота': ['нота', 'ноты', 'нот'] };
const unitCount = (n, unit) => { const f = UNIT_FORMS[unit] || [unit, unit, unit]; return `${n} ${plural(n, f[0], f[1], f[2])}`; };

/* =========================================================
   Config, selection, stats ids
   ========================================================= */
// Always the same live object per mode, so a running session and the settings sheet never diverge.
function cfgOf(m) {
  let c = DB.cfg[m.id];
  if (!c || typeof c !== 'object') c = DB.cfg[m.id] = {};
  const d = JSON.parse(JSON.stringify(Object.assign({}, m.defaults, KID() ? m.kidDefaults : null)));
  for (const k in d) if (!(k in c)) c[k] = d[k];
  if (!c.sels || typeof c.sels !== 'object') c.sels = {};
  return c;
}
const variantOf = (m, c) => (m.variant ? m.variant(c) : '_');
const statsId = (m, c) => (m.variant ? m.id + ':' + m.variant(c) : m.id);
const startCountOf = (m, c) => (KID() && m.kidStart ? m.kidStart : typeof m.startCount === 'function' ? m.startCount(c) : m.startCount || 3);
const promptOf = (m, q, c) => { const p = T(m, 'prompt'); return typeof p === 'function' ? p(q, c) : p; };
const isSelectable = (m, c) => (typeof m.selectable === 'function' ? m.selectable(c) : m.selectable !== false);
function selOf(m, c) {
  if (!c.sels) c.sels = {};
  const k = variantOf(m, c), all = m.allItems(c);
  let s = c.sels[k];
  if (!Array.isArray(s) || s.filter(x => all.includes(x)).length < 2) s = m.levels(c).slice(0, startCountOf(m, c));
  s = s.filter(x => all.includes(x));
  c.sels[k] = s;
  return s;
}
const ansType = () => (typeof P.mode.answer === 'function' ? P.mode.answer(P.c) : P.mode.answer);
const unitOf = (m, c) => (m.unitFor ? m.unitFor(c) : m.unit || 'вариант');
const parseItem = (m, k) => (m.kind === 'str' ? k : Number(k));

/* =========================================================
   Adaptive picking, recording, level-ups
   ========================================================= */
function pickItem(s, sel) {
  if (sel.length === 1) { s.last = sel[0]; return sel[0]; }
  const di = s.requeue.findIndex(r => r.due <= s.qi && sel.includes(r.item) && r.item !== s.last);
  if (di >= 0) { const it = s.requeue[di].item; s.requeue.splice(di, 1); s.last = it; return it; }
  const st = statsOf(P.sid);
  const w = sel.map(it => {
    if (it === s.last) return 0.15;
    if (!DB.settings.adaptive) return 1;
    const x = st.s[String(it)], acc = itemAcc(x);
    let v = acc == null ? 1.6 : 0.55 + 2.2 * (1 - acc);
    if (!x || x.a < 6) v += 0.6;
    return v;
  });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < sel.length; i++) { r -= w[i]; if (r <= 0) { s.last = sel[i]; return sel[i]; } }
  s.last = sel[sel.length - 1];
  return s.last;
}
function recordItem(modeId, sid, item, ok, given, ms) {
  const st = statsOf(sid), k = String(item);
  const x = st.s[k] || (st.s[k] = { a: 0, c: 0, r: '', t: 0 });
  x.a++; if (ok) x.c++;
  x.r = (x.r + (ok ? '1' : '0')).slice(-20);
  if (ok && ms && ms < 15000) x.t = x.t ? Math.round(x.t * 0.8 + ms * 0.2) : Math.round(ms);
  if (!ok && given != null && String(given) !== k) {
    const cf = st.conf[k] || (st.conf[k] = {});
    cf[String(given)] = (cf[String(given)] || 0) + 1;
  }
  const d = dayRec(true);
  d.n++; if (ok) d.c++;
  d.g = DB.settings.goal;
  const mm = d.m[modeId] || (d.m[modeId] = [0, 0]);
  mm[0]++; if (ok) mm[1]++;
  if (d.n === DB.settings.goal) setTimeout(() => { toast('Цель на сегодня выполнена!'); confetti(); }, 900);
}
function checkLevel() {
  const { mode: m, c, s } = P;
  if (P.drill || !c.auto) return;
  if (m.autoStep) { m.autoStep(s, c); return; }
  const next = m.levels(c).find(x => !P.sel.includes(x) && m.allItems(c).includes(x));
  if (next == null) return;
  const w = s.win.slice(-20);
  if (w.length < Math.max(12, P.sel.length * 3)) return;
  if (w.filter(Boolean).length / w.length < 0.9) return;
  P.sel.push(next);
  s.win = [];
  s.unlocked.push(next);
  P.rebuild = true;
  const sub = m.itemSub(next, c);
  toast(`Добавлено: ${unitOf(m, c)} ${m.itemLabel(next, c)}${sub ? ' (' + sub + ')' : ''}`);
}

/* =========================================================
   Practice controller
   ========================================================= */
const P = { mode: null, c: null, sel: null, sid: null, s: null, q: null, phase: 'idle', ui: {}, listen: false, drill: false, rebuild: false };

async function startSession(modeId, opts = {}) {
  const m = MODES[modeId];
  let c = cfgOf(m);
  P.drill = !!opts.sel;
  if (P.drill) c = Object.assign({}, c, opts.override || {}, { auto: false });
  P.mode = m; P.c = c;
  P.sel = P.drill ? opts.sel.slice() : selOf(m, c);
  P.sid = statsId(m, c);
  P.s = { qi: 0, total: 0, correct: 0, items: 0, itemsOk: 0, streak: 0, best: 0, requeue: [], last: null, win: [], qwin: [], key: null, sinceKey: 0, res: {}, unlocked: [], times: [], lastAt: Date.now() };
  P.q = null; P.phase = 'loading'; P.rebuild = false; P.listen = false;
  if (!P.drill) { DB.last = m.id; save(); }
  buildPractice();
  show('practice');
  setFeedback('wait', 'Загружаю звук…', '');
  await AudioEngine.ready();
  if (P.mode !== m || P.phase !== 'loading') return;
  if (m.answer === 'sing') {
    setFeedback('wait', 'Включаю микрофон…', '');
    try { await Mic.start(onPitch); }
    catch (e) {
      P.phase = 'idle';
      renderControls();
      const insecure = location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1';
      setFeedback('bad', 'Нет доступа к микрофону', insecure ? 'нужен адрес с https://' : 'разреши микрофон для этого сайта');
      return;
    }
    if (P.mode !== m) { Mic.stop(); return; }
  }
  nextQuestion();
}

async function nextQuestion() {
  const { mode: m, c, s } = P;
  if (!m) return;
  if (c.count && s.total >= c.count) { finishSession(); return; }
  AudioEngine.stopAll();
  P.listen = false;
  s.qi++;
  const q = m.newQ(s, c, P.sel);
  q.pre = q.pre || 0;
  q.given = q.targets.slice(0, q.pre);
  q.replays = 0; q.results = null; q.ok = null; q.hinted = false;
  P.q = q; P.phase = 'listening';
  const t = ansType();
  if (P.rebuild || t === 'sing' || t === 'reading' || (t === 'piano' && m.id === 'dictation')) { P.rebuild = false; buildAnswer(); }
  else clearMarks();
  P.result = null;
  if (m.ball) ballTo(0);
  renderHead(); renderSeq();
  setFeedback('wait', m.listenText ? m.listenText(q, c) : 'Слушай', '');
  renderControls();
  const ok = await m.playQ(q, c, 'first');
  if (!ok || P.q !== q || P.phase !== 'listening') return;
  if (m.answer === 'sing') { await sleep(250); if (P.q !== q || P.phase !== 'listening') return; }
  toAnswering(q);
}

function toAnswering(q) {
  if (P.q !== q) return;
  const m = P.mode;
  q.t0 = performance.now();
  if (m.ball) ballHide();
  setFeedback('', promptOf(m, q, P.c), m.showKey && m.showKey(P.c) && q.key ? keyName(q.key.pc, q.key.scale) : m.promptSub ? m.promptSub(q, P.c) : '');
  if (m.answer === 'sing') {
    P.phase = 'singing';
    AudioEngine.stopAll();
    q.hold = 0; q.lastT = performance.now(); q.gap = 0;
    P.listen = true;
    P.ui.fbSub.textContent = 'пой, я слушаю';
  } else P.phase = 'answering';
  renderControls();
}

async function replay(how = 'again') {
  const { mode: m, c, q } = P;
  if (!q || P.phase === 'loading' || P.phase === 'idle') return;
  const lim = c.replays && c.replays !== 'inf' ? Number(c.replays) : null;
  if (how === 'again' && lim != null && P.phase !== 'answered') {
    if (q.replays >= lim) return;
    q.replays++;
    renderControls();
  }
  if (m.answer === 'sing') {
    const wasSinging = P.phase === 'singing';
    P.listen = false;
    const ok = await m.playQ(q, c, how);
    if (ok && wasSinging && P.q === q && P.phase === 'singing') { await sleep(250); if (P.q === q && P.phase === 'singing') { AudioEngine.stopAll(); q.hold = 0; q.lastT = performance.now(); P.listen = true; } }
    if (ok && P.q === q && P.phase === 'listening') toAnswering(q);
    return;
  }
  const ok = await m.playQ(q, c, how);
  if (ok && P.q === q && P.phase === 'listening') toAnswering(q);
}

function playTonic() {
  const q = P.q;
  if (q && q.key) AudioEngine.play([{ m: q.key.t, at: 0, dur: 1.2, vel: 0.8 }]);
}

function input(id) {
  const { mode: m, c, q } = P;
  if (!q || P.phase !== 'answering') return;
  const item = m.toItem ? m.toItem(id, q, c) : id;
  if (q.targets.length === 1) {
    q.given = [item];
    if (m.tapSound) m.tapSound(item, q, 0, c);
    evaluate();
    return;
  }
  const pos = q.given.length;
  if (pos >= q.targets.length) return;
  q.given.push(item);
  if (m.tapSound) m.tapSound(item, q, pos, c);
  renderSeq();
  if (q.given.length === q.targets.length) evaluate();
  else renderControls();
}
function backspace() {
  const q = P.q;
  if (!q || P.phase !== 'answering' || q.given.length <= q.pre) return;
  q.given.pop();
  renderSeq(); renderControls();
}

function evaluate() {
  const { mode: m, c, s, q } = P;
  P.phase = 'answered';
  P.listen = false;
  const single = q.targets.length === 1;
  const ms = single && q.t0 ? performance.now() - q.t0 : null;
  let errs = 0;
  q.results = q.targets.map((t, i) => {
    if (i < q.pre) return null;
    const g = q.given[i];
    const ok = g === t && !q.hinted;
    recordItem(m.id, P.sid, t, ok, g, ms);
    s.items++; if (ok) s.itemsOk++;
    const r = s.res[t] || (s.res[t] = { a: 0, c: 0 });
    r.a++; if (ok) r.c++;
    s.win.push(ok);
    if (!ok) { errs++; s.requeue.push({ item: t, due: s.qi + 2 + rand(3) }); }
    return ok;
  });
  if (s.requeue.length > 6) s.requeue.splice(0, s.requeue.length - 6);
  q.ok = errs === 0;
  s.total++;
  if (q.ok) { s.correct++; s.streak++; s.best = Math.max(s.best, s.streak); } else s.streak = 0;
  s.qwin.push(q.ok);
  if (ms != null && q.ok) s.times.push(ms);
  const now = Date.now(), d = dayRec(true);
  d.sec += Math.min(45, (now - s.lastAt) / 1000);
  s.lastAt = now;
  markAnswer(q);
  renderSeq(); renderHead();
  let [main, sub] = m.feedback(q, c, q.ok);
  if (KID()) main = q.ok ? pick(['Ура!', 'Точно!', 'Молодец!', 'Отлично!', 'Здорово!']) : 'Почти! ' + main;
  P.result = { ok: q.ok, main, sub };
  if (q.key && !KID()) P.ui.fbSub.textContent = keyName(q.key.pc, q.key.scale);
  if (!q.ok && navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* ignore */ } }
  checkLevel();
  save();
  renderControls();
  (async () => {
    const r = m.after ? m.after(q, c, q.ok) : null;
    if (r) await r;
    if (P.q !== q || P.phase !== 'answered') return;
    if (q.ok && DB.settings.autoAdvance) {
      await sleep(r ? 300 : 650);
      if (P.q === q && P.phase === 'answered') nextQuestion();
    }
  })();
}

function stopPractice() {
  AudioEngine.stopAll();
  if (Mic.on) Mic.stop();
  P.listen = false;
  P.phase = 'idle';
  P.q = null;
}
function finishSession() {
  const had = P.s && P.s.total;
  stopPractice();
  save();
  Cloud.flush();
  if (!had) { renderHome(); show('home'); return; }
  renderSummary();
  show('summary');
}

/* ---------- singing ---------- */
function onPitch(midi) {
  const q = P.q;
  if (!q || !P.mode || P.mode.answer !== 'sing') return;
  const lad = P.ui.answer && P.ui.answer.querySelector('.ladder');
  const mk = lad && lad.querySelector('.marker');
  if (P.phase !== 'singing' || !P.listen) { if (mk) mk.hidden = true; return; }
  const now = performance.now();
  const dt = Math.min(100, now - (q.lastT || now));
  q.lastT = now;
  if (midi == null) {
    q.gap += dt;
    if (q.gap > 200) q.hold = Math.max(0, q.hold - dt);
    if (mk) mk.hidden = true;
    if (q.gap > 400) P.ui.fbSub.textContent = 'пой, я слушаю';
    setHold(q.hold / HOLD_MS);
    return;
  }
  q.gap = 0;
  const { rel, cents } = P.mode.singPos(q, midi);
  const inTol = Math.abs(cents) <= P.c.tol;
  if (mk) {
    const max = +lad.dataset.max, min = +lad.dataset.min;
    const y = max - clamp(rel, min - 0.5, max + 0.5);
    mk.hidden = false;
    mk.style.top = `calc(${y.toFixed(3)} * var(--u) + (var(--u) - 4px) / 2 - 1px)`;
    mk.dataset.ok = inTol ? '1' : '0';
  }
  const heard = cap(noteName(Math.round(midi)));
  const a = Math.abs(cents);
  if (KID()) P.ui.fbSub.textContent = inTol ? 'Так! Держи звук' : a <= 100 ? (cents > 0 ? 'Чуть ниже' : 'Чуть выше') : (cents > 0 ? 'Ниже' : 'Выше');
  else P.ui.fbSub.textContent = a <= 100 ? `слышу ${heard}, ${cents > 0 ? '+' : cents < 0 ? '−' : ''}${a}¢` : `слышу ${heard}, ${cents > 0 ? 'выше' : 'ниже'} цели`;
  if (inTol) q.hold += dt; else q.hold = Math.max(0, q.hold - dt * 1.5);
  setHold(q.hold / HOLD_MS);
  if (q.hold >= HOLD_MS) {
    P.listen = false;
    q.cents = cents;
    q.given = [q.targets[0]];
    if (mk) mk.hidden = true;
    evaluate();
  }
}
function setHold(f) {
  const r = P.ui.answer && P.ui.answer.querySelector('.rung.target .fill');
  if (r) r.style.transform = `scaleX(${clamp(f, 0, 1).toFixed(3)})`;
}
async function singHint() {
  const q = P.q;
  if (!q || P.phase !== 'singing') return;
  q.hinted = true;
  P.listen = false;
  const ok = await P.mode.hintSound(q);
  if (ok && P.q === q && P.phase === 'singing') { await sleep(250); if (P.q === q && P.phase === 'singing') { AudioEngine.stopAll(); q.hold = 0; q.lastT = performance.now(); P.listen = true; } }
}
function singSkip() {
  const q = P.q;
  if (!q || P.phase !== 'singing') return;
  P.listen = false;
  q.given = [null];
  evaluate();
}

function buildPractice() {
  const m = P.mode, v = $('#v-practice');
  const ui = (P.ui = {});
  ui.barFill = h('span');
  ui.streak = h('span', { class: 'streak', hidden: true }, icon('flame'), h('b', {}, '0'));

    h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Завершить', title: 'Завершить (Esc)', 'data-hk': 'Escape', onclick: finishSession }, icon('close')),
    h('div', { class: 'p-bar', role: 'progressbar' }, ui.barFill),
    ui.streak,
    h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Как заниматься', title: 'Как заниматься', onclick: () => openInfo(m) }, icon('info')),
    P.drill ? null : h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Настройки режима', title: 'Настройки режима', onclick: () => openModeSettings(m) }, icon('tune')));
  ui.fbMain = h('div', { class: 'fb-main' });

}

function buildAnswer() {
  const m = P.mode, c = P.c, a = P.ui.answer, t = ansType();
  a.replaceChildren();
  if (t === 'ladder') a.append(buildLadder(m.rows(c, P.sel), true, { ball: !!m.ball }));
  else if (t === 'grid') a.append(buildGrid());
  else if (t === 'piano') a.append(buildPiano());
  else if (t === 'sing' && P.q) a.append(buildLadder(m.rows(c, P.sel, P.q), false, { marker: true }));
  else if (t === 'reading') a.append(buildReading(P.q ? P.q.clef : 'treble', P.q ? P.q.d : null));
}
function buildReading(clef, d) {
  const staff = h('div', { class: 'staff-box', html: staffSVG(clef, d) });
  P.ui.staff = staff;
  const keys = h('div', { class: 'note-keys', role: 'group', 'aria-label': 'Названия нот' }, [0, 1, 2, 3, 4, 5, 6].map(l =>
    h('button', { type: 'button', class: 'nkey', style: `--c:${STEP_COLORS[l][0]};--t:${STEP_COLORS[l][1]}`, 'data-id': String(l), 'data-hk': READ_KEYS[l], 'aria-label': letterName(l), onclick: () => input(l) },
      h('span', {}, letterName(l)), h('span', { class: 'kbd' }, 'CDEFGAB'[l]), h('span', { class: 'mark' }))));
  return h('div', { class: 'reading' }, staff, keys);
}
function setStaff(clef, d, state, label) { if (P.ui.staff) P.ui.staff.innerHTML = staffSVG(clef, d, state, label); }

const BALL_SVG = '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#fff" stroke="#141833" stroke-width="2.6"/><circle cx="14.6" cy="18" r="2.7" fill="#141833"/><circle cx="25.4" cy="18" r="2.7" fill="#141833"/><path d="M14.2 24.2q5.8 4.8 11.6 0" stroke="#141833" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>';
// Xylophone ladder: one row per semitone, higher notes sit higher and get shorter bars.
