/* ---------- confetti ---------- */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = h('canvas', { class: 'confetti', 'aria-hidden': 'true' });
  document.body.append(cv);
  const W = (cv.width = innerWidth * dpr), H = (cv.height = innerHeight * dpr), g = cv.getContext('2d');
  const parts = Array.from({ length: 150 }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.25, y: H * 0.38, vx: (Math.random() - 0.5) * 22 * dpr, vy: (-Math.random() * 17 - 7) * dpr,
    w: (6 + Math.random() * 6) * dpr, h: (9 + Math.random() * 8) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: pick(STEP_COLORS)[0],
  }));
  const t0 = performance.now();
  (function frame(now) {
    const k = (now - t0) / 1900;
    g.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.vy += 0.5 * dpr; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.globalAlpha = Math.max(0, 1 - k * k); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
    });
    if (k < 1) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

        const x = a.s[k], y = b.s[k];
        if (!x) { a.s[k] = y; continue; }
        const t = x.t && y.t ? Math.round((x.t * x.a + y.t * y.a) / (x.a + y.a)) : x.t || y.t;
        a.s[k] = { a: x.a + y.a, c: x.c + y.c, r: (x.r + y.r).slice(-20), t };

      for (const t in b.conf || {}) for (const g in b.conf[t]) {

      x.n += y.n; x.c += y.c; x.sec = (x.sec || 0) + (y.sec || 0); x.g = Math.max(x.g || 0, y.g || 0);
      for (const m in y.m || {}) { const mm = x.m[m] || (x.m[m] = [0, 0]); mm[0] += y.m[m][0]; mm[1] += y.m[m][1]; }

    out.seen = Object.assign({}, out.seen, extra.seen);
    out.last = extra.last || out.last;
    out.mtime = Date.now();
    return out;
  }
  const row = () => ({ user_id: user.id, data: { v: 4, profile: DB }, updated_at: new Date().toISOString() });
  async function push() {
    if (!sb || !user || !DB) return;
    DB.owner = user.id;
    const { error: e } = await sb.from('progress').upsert(row());
    if (e) throw e;
    lastSync = Date.now();
  }
  function adopt(p, note) {
    p.owner = user.id;
    ROOT.profile = p; DB = p;
    writeNow();
    refreshViews(note);
  }
  async function syncNow(first, manual) {
    if (!sb || !user) return;
    if (pushing) await pushing;
    state = 'syncing'; emit();
    try {
      const { data, error: e } = await sb.from('progress').select('data').eq('user_id', user.id).maybeSingle();
      if (e) throw e;
      const remote = remoteProfile(data && data.data), local = DB;
      if (!remote) {
        if (!local) { refreshViews(); }                                     // new account: the welcome screen asks who trains
        else if (local.owner && local.owner !== user.id) { clearProfile(); refreshViews(); }  // belongs to another account
        else { local.owner = user.id; writeNow(); await push(); }           // first sign-in: this device's progress becomes the account's
      } else if (!local || (local.owner && local.owner !== user.id)) {
        adopt(remote, first ? 'Прогресс загружен из аккаунта' : '');
      } else if (local.owner === user.id) {
        if ((remote.mtime || 0) > (local.mtime || 0)) adopt(remote, '');
        else if ((local.mtime || 0) > (remote.mtime || 0)) await push();
      } else if (isEmpty(local)) {
        adopt(remote, first ? 'Прогресс загружен из аккаунта' : '');
      } else {
        adopt(mergeProgress(remote, local), 'Прогресс с этого устройства добавлен в аккаунт');
        await push();
      }

      state = 'ok'; error = ''; dirty = false;
      if (manual) toast('Прогресс синхронизирован');

    emit();
  }
  function refreshViews(note) {
    if (VIEW === 'practice' || sheetOpen()) { if (note) toast(note); return; }
    if (!DB) { renderWelcome(null, false); return; }

    if (note) toast(note);
  }
  // Saving: every 10 s while something changed, plus right away on triggers (end of a session, tab hidden, sign-out).
  function schedule() { if (user) dirty = true; }
  function flush() {
    if (!user || !DB) return Promise.resolve(true);
    if (pushing) return pushing.then(() => (dirty ? flush() : !error));
    dirty = false;
    state = 'syncing'; emit();
    pushing = push().then(() => { state = 'ok'; error = ''; lastToastErr = ''; return true; })
      .catch(e => {
        console.error(e);
        dirty = true; state = 'error'; error = ruError(e);

  setInterval(() => { if (user && dirty) flush(); }, 10000);
  // Last chance when the tab closes: a keepalive request the browser finishes even after the page is gone.
  function flushOnExit() {

    try {
      const body = JSON.stringify(row());
      if (body.length > 60000) return;   // keepalive bodies are capped at 64 KB; the 10-second saves cover the rest
      fetch(SB_URL + '/rest/v1/progress?on_conflict=user_id', {
        method: 'POST', keepalive: true, body,

  /* ---------- auth actions ---------- */
  async function need() { if (!(await load())) throw new Error('unavailable'); }
  async function google() {
    await need();

    if (e) throw e;
  }
  async function signIn(email, password) {
    await need();

    if (e) throw e;
  }
  // 'in' — signed in right away, 'confirm' — letter sent, 'exists' — the address already has an account
  async function signUp(email, password, name) {
    await need();
    const { data, error: e } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: siteURL(), data: name ? { name } : undefined } });
    if (e) throw e;
    if (data && data.session) return 'in';
    if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return 'exists';

  }
  // Confirmation without depending on the browser that signed up: a 6-digit code or a token_hash link.
  async function verifyCode(email, code) {
    await need();
    const { error: e } = await sb.auth.verifyOtp({ email, token: code, type: 'email' });
    if (e) throw e;
  }
  async function verifyLink(tokenHash, type) {
    await need();

    if (e) throw e;
  }
  async function resend(email) {
    await need();

  }
  async function reset(email) { await need(); const { error: e } = await sb.auth.resetPasswordForEmail(email, { redirectTo: siteURL() }); if (e) throw e; }
  async function setPassword(password) { await need(); const { error: e } = await sb.auth.updateUser({ password }); if (e) throw e; }
  // Signing out leaves no one's progress on the device: it already lives in the account.
  async function signOut() {
    const ok = await flush();
    if (!ok && !confirm('Не удалось сохранить последние изменения в облако. Всё равно выйти? Несохранённое пропадёт.')) return false;
    if (sb) { try { await sb.auth.signOut(); } catch (e) { console.error(e); } }
    user = null; session = null; syncedFor = null; state = 'off'; dirty = false;
    clearProfile();
    emit();
    return true;
  }
  async function deleteAccount() {
    await need();
    const { error: e } = await sb.rpc('delete_user');

    try { await sb.auth.signOut(); } catch (err) { /* the user no longer exists */ }
    user = null; syncedFor = null; state = 'off';

    emit();
  }
  async function feedback(rec) {
    await need();
    const row = Object.assign({ app_version: APP_VERSION, user_id: user ? user.id : null }, rec);
    const { error: e } = await sb.from('feedback').insert(row);
    if (e) throw e;
  }

  function boot() {
    let saved = false;
    try { saved = Object.keys(localStorage).some(k => k.startsWith('sb-') && k.endsWith('-auth-token')); } catch (e) { /* ignore */ }
    const fromLink = AUTH_URL_RE.test(location.hash + location.search);
    const errMatch = /error_description=([^&]+)/.exec(location.hash + location.search);
    if (errMatch) setTimeout(() => toast(ruError({ message: decodeURIComponent(errMatch[1].replace(/\+/g, ' ')) })), 700);
    const qs = new URLSearchParams(location.search);
    const tokenHash = qs.get('token_hash'), tokenType = qs.get('type');
    if (errMatch) cleanUrl(true);
    else cleanUrl(false);
    if (tokenHash && tokenType) {
      verifyLink(tokenHash, tokenType === 'signup' ? 'email' : tokenType)
        .then(() => {
          cleanUrl(true);
          if (tokenType === 'recovery') setTimeout(openNewPassword, 300);
          else setTimeout(() => toast('Почта подтверждена — добро пожаловать!'), 300);
        })
        .catch(e => { cleanUrl(true); setTimeout(() => toast(ruError(e)), 300); });
    } else if (saved || (fromLink && !errMatch)) load();
    document.addEventListener('visibilitychange', () => {

  return {
    load, boot, schedule, flush, syncNow, google, signIn, signUp, resend, verifyCode, reset, setPassword, signOut, deleteAccount, feedback,
    on: f => subs.add(f),
    get user() { return user; }, get state() { return state; }, get error() { return error; }, get lastSync() { return lastSync; },
  };
})();

// Supabase error → short Russian text. Never shows "null" or raw objects.
function ruError(e) {
  if (e && (e.name || e.status)) console.error('[auth]', e.name, e.status, e.code, e.message);
  let m = e && typeof e === 'object' ? (e.message || e.error_description || e.msg || '') : String(e || '');
  if (m === 'null' || m === 'undefined' || m === '{}' || m === '[object Object]') m = '';
  const code = e && e.code ? String(e.code) : '';
  const status = e && e.status;
  if (m === 'unavailable') return 'Нет связи с сервером. Проверь интернет.';
  if (/Invalid login credentials|invalid_credentials/i.test(m + code)) return 'Неверная почта или пароль';
  if (/already registered|already been registered|user_already_exists|email_exists/i.test(m + code)) return 'Этот адрес уже зарегистрирован. Войди или восстанови пароль.';
  if (/Email not confirmed|email_not_confirmed/i.test(m + code)) return 'Почта ещё не подтверждена. Открой письмо и нажми ссылку.';
  if (/Password should be at least|weak.?password/i.test(m + code)) return 'Пароль слишком простой: минимум 6 символов';
  if (/over_email_send_rate_limit|email rate limit/i.test(m + code)) return 'Письма сейчас отправляются слишком часто. Попробуй через час или войди через Google.';
  if (/rate limit|too many|security purposes|over_request_rate_limit/i.test(m + code) || status === 429) return 'Слишком много попыток. Подожди минуту.';
  if (/Error sending|sending confirmation|sending recovery|smtp/i.test(m)) return 'Не получилось отправить письмо. Попробуй позже или войди через Google.';
  if (/provider is not enabled|Unsupported provider|validation_failed.*provider/i.test(m + code)) return 'Вход через Google ещё не настроен';
  if (/Signups not allowed|signup_disabled/i.test(m + code)) return 'Регистрация по почте сейчас выключена. Войди через Google.';
  if (/invalid.*email|Unable to validate email|email_address_invalid/i.test(m + code)) return 'Похоже, адрес почты с ошибкой';
  if (/relation .* does not exist|Could not find the table|schema cache|PGRST205/i.test(m + code)) return 'База ещё не настроена: нужно выполнить setup.sql';
  if (/Failed to fetch|NetworkError|network|Load failed/i.test(m)) return 'Нет связи с сервером. Проверь интернет.';
  if (/Token has expired or is invalid|otp_expired|invalid.*(link|token)|expired/i.test(m + code)) return 'Код или ссылка устарели либо введены с ошибкой. Запроси новое письмо.';
  if (status >= 500) return 'Сервер входа сейчас не отвечает. Попробуй через пару минут.';
  return m ? m : 'Что-то пошло не так. Попробуй ещё раз или войди через Google.';
}

function lockScroll() {

}
function unlockScroll() { document.body.classList.remove('locked'); document.body.style.removeProperty('--sbw'); }
// Phones: pull the sheet down by its handle or header to close it.
function enableSheetDrag(box) {
  let y0 = null, dy = 0, t0 = 0;
  const start = e => {
    if (e.pointerType === 'mouse' || e.target.closest('button, input, select, textarea')) return;
    y0 = e.clientY; dy = 0; t0 = performance.now();
    box.classList.add('dragging');
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* synthetic or already released pointer */ }
  };
  const move = e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); box.style.transform = `translateY(${dy}px)`; };
  const end = () => {
    if (y0 == null) return;
    y0 = null;
    box.classList.remove('dragging');
    const fast = dy > 40 && dy / Math.max(1, performance.now() - t0) > 0.6;
    if (dy > 110 || fast) { closeSheet(); return; }
    box.style.transition = 'transform .2s cubic-bezier(.2,.9,.25,1)';
    box.style.transform = '';
    setTimeout(() => { box.style.transition = ''; }, 220);
  };
  box.querySelectorAll('.grab, .sheet-head').forEach(el => {
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
}
function openSheet(title, body, opts = {}) {
  const w = $('#sheet');
  if (sheetCloseTimer) { clearTimeout(sheetCloseTimer); sheetCloseTimer = null; w.classList.remove('closing'); }
  if (w.hidden) sheetReturn = document.activeElement;
  const box = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title, tabindex: '-1' },
    h('div', { class: 'grab' }),
    h('div', { class: 'sheet-head' }, h('h2', {}, title),
      h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Закрыть', onclick: () => closeSheet() }, icon('close'))),
    body,
    opts.foot ? h('div', { class: 'sheet-foot' }, opts.foot) : h('div', { class: 'sheet-pad' }));
  w.replaceChildren(box);
  w.hidden = false;
  // Close on the backdrop only when the press both started and ended there (a text selection dragged out of the sheet must not close it).
  let downOnBackdrop = false;
  w.onpointerdown = e => { downOnBackdrop = e.target === w; };
  w.onclick = e => { if (e.target === w && downOnBackdrop) closeSheet(); downOnBackdrop = false; };

function closeSheet() {
  const w = $('#sheet');

  const finish = () => { sheetCloseTimer = null; w.classList.remove('closing'); w.hidden = true; w.replaceChildren(); unlockScroll(); };

function dayStreak() {
  const g = DB.settings.goal, met = x => x && x.n >= (x.g || g);
  const d = new Date();
  let k = met(DB.days[dayKey(d)]) ? 1 : 0;
  for (let i = 0; i < 1000; i++) { d.setDate(d.getDate() - 1); if (met(DB.days[dayKey(d)])) k++; else break; }
  return k;
}
function rangeDays(n) {
  let a = 0, c = 0, sec = 0;
  const d = new Date();
  for (let i = 0; i < n; i++) { const x = DB.days[dayKey(d)]; if (x) { a += x.n; c += x.c; sec += x.sec || 0; } d.setDate(d.getDate() - 1); }
  return { a, c, sec };
}
function variantsWithData(m) {
  return Object.keys(DB.stats).filter(k => (k === m.id || k.startsWith(m.id + ':')) && Object.keys(DB.stats[k].s).length)
    .map(k => { const v = k.includes(':') ? k.slice(m.id.length + 1) : null; return { sid: k, v, c: Object.assign(JSON.parse(JSON.stringify(m.defaults)), m.fromVariant && v ? m.fromVariant(v) : {}) }; });
}
// "4 and 5 get mixed up" is symmetric, so both directions of a pair are counted together.
function confusionsOf(m, sid, v, c, minN) {
  const pairs = {}, cf = DB.stats[sid].conf || {};
  for (const t in cf) for (const g in cf[t]) {
    const k = [t, g].sort().join('|'), n = cf[t][g];
    const p = pairs[k] || (pairs[k] = { m, v, c, t: parseItem(m, t), g: parseItem(m, g), n: 0, top: 0 });
    p.n += n;
    if (n > p.top) { p.top = n; p.t = parseItem(m, t); p.g = parseItem(m, g); }
  }
  return Object.values(pairs).filter(p => p.n >= minN).sort((a, b) => b.n - a.n);
}
const visibleModes = () => modeList().flatMap(g => g[1]);
function topConfusion() {
  let best = null;
  visibleModes().forEach(id => variantsWithData(MODES[id]).forEach(({ sid, v, c }) => {
    const x = confusionsOf(MODES[id], sid, v, c, 3)[0];
    if (x && (!best || x.n > best.n)) best = x;
  }));
  return best;
}

let chartFilter = 'all';
function chartSVG(filter) {

  for (let i = 0; i < 30; i++) {
    const k = dayKey(d), x = DB.days[k];
    let n = 0, c = 0;
    if (x) { if (filter === 'all') { n = x.n; c = x.c; } else if (x.m && x.m[filter]) { n = x.m[filter][0]; c = x.m[filter][1]; } }
    days.push({ n, c, day: d.getDate(), mon: d.getMonth() + 1 });
    d.setDate(d.getDate() + 1);
  }
  const goal = DB.settings.goal;
  const max = Math.max(10, ...days.map(x => x.n), filter === 'all' ? goal * 1.15 : 0);
  const W = 600, H = 170, pb = 22, pt = 8, bw = W / 30, ih = H - pb - pt;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ответы за 30 дней">`;
  days.forEach((x, i) => {
    const xx = i * bw + 2.5, w = bw - 5, date = `${x.day}.${String(x.mon).padStart(2, '0')}`;
    if (!x.n) svg += `<rect class="zero" x="${xx}" y="${H - pb - 3}" width="${w}" height="3" rx="1.5"><title>${date}: нет занятий</title></rect>`;
    else {
      const hh = Math.max(4, (x.n / max) * ih), a = x.c / x.n;

    }

    else if (i % 5 === 4 && i < 25) svg += `<text x="${xx + w / 2}" y="${H - 5}" text-anchor="middle">${x.day}</text>`;
  });
  if (filter === 'all') { const y = H - pb - (goal / max) * ih; svg += `<line class="goal" x1="0" x2="${W}" y1="${y}" y2="${y}"/><text x="${W - 2}" y="${y - 5}" text-anchor="end">цель</text>`; }

  if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim() || '#F3F4FA');
}
function soundStatus(i) {
  if (DEV.timbre === 'synth') return '';
  if (i.status === 'loading' && i.ctx) return `Загрузка пианино: ${Math.round(i.progress * 100)}%`;
  if (i.status === 'synth') return 'Пианино не загрузилось, играет синтезатор. Проверь интернет.';
  return '';
}
let settingsSignedIn = null;

  v.replaceChildren(h('div', { class: 'settings' },

    h('h2', { class: 'set-h' }, 'Занятия'),

}
function resetStats() {
  if (!confirm(`Удалить статистику профиля «${DB.name}»? Настройки останутся.`)) return;

function syncText() {
  const st = Cloud.state;
  if (st === 'syncing') return 'Сохраняю…';
  if (st === 'error') return Cloud.error;
  if (Cloud.lastSync) {
    const sec = Math.round((Date.now() - Cloud.lastSync) / 1000);
    return sec < 60 ? 'Сохранено в облаке только что' : `Сохранено в облаке ${Math.round(sec / 60)} мин назад`;
  }
  return 'Подключаюсь…';
}
function statusLine() {
  const u = Cloud.user;
  if (!u) return h('p', { class: 'acc-status', id: 'acc-status' }, 'Прогресс хранится только на этом устройстве. Войди, чтобы он был в облаке и на любом устройстве.');
  return h('p', { class: 'acc-status', id: 'acc-status' }, h('b', {}, u.email), h('span', { class: Cloud.state === 'error' ? 'err' : '' }, syncText()));
}
function profileCard() {
  const u = Cloud.user, meta = (u && u.user_metadata) || {};
  const pic = h('button', { type: 'button', class: 'av-edit', 'aria-label': 'Сменить аватар', title: 'Сменить аватар', onclick: openAvatarPicker }, avatarEl(DB, 'avatar big'), h('span', { class: 'av-pen' }, icon('edit')));
  const name = h('input', { class: 'name-inp sm', type: 'text', maxlength: 24, value: DB.name, 'aria-label': 'Имя', autocomplete: 'nickname' });
  const saveBtn = h('button', { type: 'button', class: 'btn small go', hidden: true }, 'Сохранить');
  const dirty = () => { const t = name.value.trim(); saveBtn.hidden = !t || t === DB.name; };
  const commit = () => {
    const t = name.value.trim();
    if (!t) { name.value = DB.name; dirty(); return; }
    if (t === DB.name) return;
    DB.name = t; save(); Cloud.flush();
    renderAvatar(); saveBtn.hidden = true;
    toast('Имя сохранено');
  };
  name.addEventListener('input', dirty);
  name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); name.blur(); } });
  saveBtn.addEventListener('click', commit);
  const actions = u
    ? [h('button', { type: 'button', class: 'btn small', onclick: () => Cloud.syncNow(false, true) }, icon('replay'), 'Синхронизировать'),
       h('button', { type: 'button', class: 'btn small', onclick: async () => { if (await Cloud.signOut()) { toast('Ты вышел. Прогресс сохранён в аккаунте.'); renderWelcome(null, false); } } }, 'Выйти'),
       h('button', { type: 'button', class: 'btn small danger', onclick: async () => {
         if (!confirm('Удалить аккаунт и весь прогресс? Это нельзя отменить.')) return;
         try { await Cloud.deleteAccount(); toast('Аккаунт удалён'); renderWelcome(null, false); } catch (e) { toast(ruError(e)); }
       } }, 'Удалить аккаунт')]
    : [h('button', { type: 'button', class: 'btn small go', onclick: () => openAuth('in') }, 'Войти'),
       h('button', { type: 'button', class: 'btn small', onclick: () => openAuth('up') }, 'Создать аккаунт')];
  return h('div', { class: 'list', id: 'acc-block' },
    h('div', { class: 'row prof-head' }, pic, h('div', { class: 'prof-fields' }, h('div', { class: 'name-line' }, name, saveBtn), statusLine())),
    field('Кто занимается', seg([['kid', 'Ребёнок'], ['adult', 'Взрослый']], DB.kind, val => { DB.kind = val; save(); renderSettings(); })),
    h('div', { class: 'row acc-actions' }, actions));
}

const G_LOGO = '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
// One sheet, four screens: sign in, sign up, "check your mail", password reset.
function openAuth(mode = 'in', email0 = '') {
  Cloud.load();
  let mode_ = mode, email = email0, cooldown = 0, timer = null;
  const body = h('div', { class: 'auth' });
  const title = () => ({ in: 'Вход', up: 'Регистрация', mail: 'Проверь почту', reset: 'Новый пароль' })[mode_];
  const go = m => { mode_ = m; render(); const t = $('#sheet .sheet-head h2'); if (t) t.textContent = title(); };
  const msgEl = () => h('p', { class: 'auth-msg', role: 'status', 'aria-live': 'polite' });
  const say = (el, t, kind) => { el.textContent = t || ''; el.className = 'auth-msg' + (kind ? ' ' + kind : ''); };
  const busy = (b, on) => { b.disabled = on; b.classList.toggle('busy', on); };
  function emailInput() {
    const i = h('input', { class: 'name-inp sm', type: 'email', placeholder: 'Почта', autocomplete: 'email', inputmode: 'email', 'aria-label': 'Почта', value: email || null });
    i.addEventListener('input', () => { email = i.value.trim(); });
    return i;
  }
  function passInput(placeholder, ac) {
    const i = h('input', { class: 'name-inp sm', type: 'password', placeholder, autocomplete: ac, 'aria-label': 'Пароль' });
    const eye = h('button', { type: 'button', class: 'eye', 'aria-label': 'Показать пароль', onclick: () => { i.type = i.type === 'password' ? 'text' : 'password'; eye.classList.toggle('on', i.type === 'text'); } }, icon('eye'));
    return [h('div', { class: 'pass-wrap' }, i, eye), i];
  }
  function googleBtn(msg) {
    const g = h('button', { type: 'button', class: 'btn wide g-btn', html: G_LOGO + '<span>Продолжить с Google</span>' });
    g.addEventListener('click', async () => { busy(g, true); say(msg, ''); try { await Cloud.google(); } catch (err) { say(msg, ruError(err), 'err'); busy(g, false); } });
    return g;
  }
  function render() {
    clearInterval(timer);
    if (mode_ === 'mail') {
      const msg = msgEl();
      const again = h('button', { type: 'button', class: 'btn wide' }, 'Отправить письмо ещё раз');
      const tick = () => { again.disabled = cooldown > 0; again.textContent = cooldown > 0 ? `Отправить ещё раз через ${cooldown} с` : 'Отправить письмо ещё раз'; };
      cooldown = Math.max(cooldown, 45); tick();
      timer = setInterval(() => { cooldown = Math.max(0, cooldown - 1); tick(); if (!cooldown) clearInterval(timer); }, 1000);
      again.addEventListener('click', async () => {
        busy(again, true);
        try { await Cloud.resend(email); say(msg, 'Письмо отправлено ещё раз', 'ok'); cooldown = 60; timer = setInterval(() => { cooldown = Math.max(0, cooldown - 1); tick(); if (!cooldown) clearInterval(timer); }, 1000); }
        catch (err) { say(msg, ruError(err), 'err'); }
        busy(again, false); tick();
      });
      const code = h('input', { class: 'name-inp sm code-inp', type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 10, placeholder: '••••••', 'aria-label': 'Код из письма' });
      const confirmBtn = h('button', { type: 'button', class: 'btn go wide' }, 'Подтвердить');
      const doConfirm = async () => {
        const c = code.value.replace(/\D/g, '');
        if (c.length < 6) { say(msg, 'В коде 6 цифр — посмотри в письме', 'err'); code.focus(); return; }
        busy(confirmBtn, true);
        try { await Cloud.verifyCode(email, c); closeSheet(); toast('Почта подтверждена — добро пожаловать!'); }
        catch (err) { say(msg, ruError(err), 'err'); busy(confirmBtn, false); }
      };
      code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, ''); if (code.value.length === 6) doConfirm(); });
      code.addEventListener('keydown', e => { if (e.key === 'Enter') doConfirm(); });
      confirmBtn.addEventListener('click', doConfirm);
      body.replaceChildren(
        h('div', { class: 'mail-ic' }, icon('mail')),
        h('p', { class: 'text auth-lead' }, 'Мы отправили письмо на ', h('b', {}, email), '. Нажми в нём кнопку или введи код отсюда:'),
        code, confirmBtn,
        h('p', { class: 'auth-note' }, 'Письма нет? Загляни в «Спам» или «Промоакции».'),
        again,
        h('button', { type: 'button', class: 'btn wide', onclick: () => go('in') }, 'Уже подтвердил — войти'),
        h('button', { type: 'button', class: 'link', onclick: () => go('up') }, 'Ввести другой адрес'),
        msg);
      return;
    }
    if (mode_ === 'reset') {
      const msg = msgEl(), ei = emailInput();
      const send = h('button', { type: 'submit', class: 'btn go wide' }, 'Прислать ссылку');
      const form = h('form', { class: 'auth-form', novalidate: true }, ei, send);
      form.addEventListener('submit', async e => {
        e.preventDefault();
        if (!EMAIL_RE.test(email)) { say(msg, 'Впиши почту, на которую зарегистрирован аккаунт', 'err'); ei.focus(); return; }
        busy(send, true);
        try { await Cloud.reset(email); say(msg, `Готово. Ссылка для нового пароля отправлена на ${email}.`, 'ok'); }
        catch (err) { say(msg, ruError(err), 'err'); }
        busy(send, false);
      });
      body.replaceChildren(h('p', { class: 'text auth-lead' }, 'Пришлём ссылку, по которой можно задать новый пароль.'), form, msg,
        h('button', { type: 'button', class: 'link', onclick: () => go('in') }, 'Вспомнил пароль'));
      return;
    }
    const up = mode_ === 'up';
    const msg = msgEl(), ei = emailInput();
    const ni = up ? h('input', { class: 'name-inp sm', type: 'text', maxlength: 24, placeholder: 'Как тебя зовут?', autocomplete: 'given-name', 'aria-label': 'Имя', value: DB && DB.name !== 'Я' ? DB.name : null }) : null;
    const [pw, pi] = passInput(up ? 'Пароль, от 6 символов' : 'Пароль', up ? 'new-password' : 'current-password');
    const submit = h('button', { type: 'submit', class: 'btn go wide' }, up ? 'Создать аккаунт' : 'Войти');
    const form = h('form', { class: 'auth-form', novalidate: true }, ni, ei, pw, submit);
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const p = pi.value, nm = ni ? ni.value.trim() : '';
      if (up && !nm) { say(msg, 'Придумай имя — его увидишь на главной', 'err'); ni.focus(); return; }
      if (!EMAIL_RE.test(email)) { say(msg, 'Похоже, адрес почты с ошибкой', 'err'); ei.focus(); return; }
      if (p.length < 6) { say(msg, 'Пароль — минимум 6 символов', 'err'); pi.focus(); return; }
      busy(submit, true); say(msg, '');
      try {
        if (up) {
          if (DB) { DB.name = nm; save(); }
          const r = await Cloud.signUp(email, p, nm);
          if (r === 'confirm') { go('mail'); return; }
          if (r === 'exists') { busy(submit, false); go('in'); setTimeout(() => { const m = $('#sheet .auth-msg'); if (m) say(m, 'Этот адрес уже зарегистрирован. Введи пароль или восстанови его.', 'err'); }, 0); return; }
        } else await Cloud.signIn(email, p);
        closeSheet();
      } catch (err) {
        busy(submit, false);
        const t = ruError(err);
        say(msg, t, 'err');
        if (/не подтверждена/.test(t)) msg.after(h('button', { type: 'button', class: 'btn wide', onclick: async () => { try { await Cloud.resend(email); go('mail'); } catch (x) { say(msg, ruError(x), 'err'); } } }, 'Отправить письмо ещё раз'));
      }
    });
    body.replaceChildren(
      h('div', { class: 'seg auth-seg' },
        h('button', { type: 'button', 'aria-pressed': String(!up), onclick: () => go('in') }, 'Вход'),
        h('button', { type: 'button', 'aria-pressed': String(up), onclick: () => go('up') }, 'Регистрация')),
      h('p', { class: 'text auth-lead' }, up ? 'Один аккаунт — один ученик. Прогресс этого устройства перейдёт в аккаунт.' : 'Прогресс загрузится автоматически.'),
      googleBtn(msg), h('div', { class: 'or' }, h('span', {}, 'или по почте')), form,
      up ? null : h('button', { type: 'button', class: 'link', onclick: () => go('reset') }, 'Забыли пароль?'),
      msg);
  }
  render();
  openSheet(title(), body, { onClose: () => clearInterval(timer) });
}
function openNewPassword() {
  const pass = h('input', { class: 'name-inp sm', type: 'password', placeholder: 'Новый пароль, от 6 символов', autocomplete: 'new-password', 'aria-label': 'Новый пароль' });
  const msg = h('p', { class: 'auth-msg' });
  const btn = h('button', { type: 'button', class: 'btn go wide' }, 'Сохранить пароль');
  btn.addEventListener('click', async () => {
    if (pass.value.length < 6) { msg.textContent = 'Пароль — минимум 6 символов'; msg.className = 'auth-msg err'; return; }
    btn.disabled = true;
    try { await Cloud.setPassword(pass.value); closeSheet(); toast('Пароль изменён'); } catch (e) { msg.textContent = ruError(e); msg.className = 'auth-msg err'; btn.disabled = false; }
  });
  openSheet('Новый пароль', h('div', { class: 'auth' }, h('p', { class: 'text auth-lead' }, 'Придумай новый пароль для входа.'), pass, msg), { foot: btn });
}

let lastFeedback = 0;
function openFeedback(rating0) {
  let rating = rating0 || 0;
  const stars = h('div', { class: 'rate', role: 'group', 'aria-label': 'Оценка' });
  const paint = () => stars.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i < rating));
  for (let i = 1; i <= 5; i++) stars.append(h('button', { type: 'button', 'aria-label': `${i} из 5`, onclick: () => { rating = i; paint(); } }, icon('star')));
  paint();
  const text = h('textarea', { class: 'fb-text', maxlength: 2000, rows: 5, placeholder: 'Что понравилось, что мешает, чего не хватает?', 'aria-label': 'Сообщение' });
  const contact = h('input', { class: 'name-inp sm', type: 'text', maxlength: 120, placeholder: 'Почта или Telegram, если ждёшь ответа', value: Cloud.user ? Cloud.user.email : '', 'aria-label': 'Контакт' });
  const msg = h('p', { class: 'auth-msg' });
  const btn = h('button', { type: 'button', class: 'btn go wide' }, 'Отправить');
  btn.addEventListener('click', async () => {
    const t = text.value.trim();
    if (!t && !rating) { msg.textContent = 'Напиши пару слов или поставь оценку'; msg.className = 'auth-msg err'; return; }
    if (Date.now() - lastFeedback < 60000) { msg.textContent = 'Подожди минуту перед следующим сообщением'; msg.className = 'auth-msg err'; return; }
    btn.disabled = true;
    try {
      await Cloud.feedback({ rating: rating || null, message: t || '(только оценка)', contact: contact.value.trim() || null });
      lastFeedback = Date.now();
      DB.seen.feedbackAt = Date.now(); save();
      closeSheet(); toast('Спасибо! Сообщение отправлено');
      if (VIEW === 'home') renderHome();
    } catch (e) { msg.textContent = ruError(e); msg.className = 'auth-msg err'; btn.disabled = false; }
  });
  const lead = rating >= 4 ? 'Спасибо! Что нравится больше всего?' : rating ? 'Что стоит улучшить?' : 'Как тебе приложение?';
  openSheet('Обратная связь', h('div', { class: 'auth' }, h('p', { class: 'text auth-lead' }, lead), stars, text, contact, msg), { foot: btn });
  setTimeout(() => text.focus({ preventScroll: true }), 250);
}
